<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const _RC = (typeof Recharts !== "undefined" && Recharts) ? Recharts : {};
const _Dummy = function () { return null; };
const ResponsiveContainer = _RC.ResponsiveContainer || _Dummy;
const AreaChart = _RC.AreaChart || _Dummy, Area = _RC.Area || _Dummy;
const LineChart = _RC.LineChart || _Dummy, Line = _RC.Line || _Dummy;
const BarChart = _RC.BarChart || _Dummy, Bar = _RC.Bar || _Dummy;

const CartesianGrid = _RC.CartesianGrid || _Dummy, Tooltip = _RC.Tooltip || _Dummy;

const STORAGE_KEY = "tharwa-data-v1";

const ROLES = {
  add:      { label: "أصل (يُضاف للثروة)",       tone: "pos" },
  market:   { label: "القيمة السوقية للاستثمار",  tone: "pos" },
  cost:     { label: "القيمة الشرائية للاستثمار", tone: "neutral" },
  subtract: { label: "دين (يُخصم من الثروة)",     tone: "neg" },
};
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const SCOPE_LABEL = { daily: "يومي", monthly: "شهري", yearly: "سنوي" };
const TAB_ACCENT = { debts: "#1E875A", goals: "#B4894A", dashboard: "#2D6CB5" };

const uid = () => Math.random().toString(36).slice(2, 10);

function defaultGoals() {
  return [
    { id: uid(), name: "الهدف الشهري", scope: "monthly" },
    { id: uid(), name: "الهدف السنوي", scope: "yearly" },
  ];
}
function defaultPages() {
  return { dashboard: "لوحة التحكم", entries: "الإدخالات اليومية", log: "السجل اليومي", debts: "الديون", goals: "الأهداف" };
}
function defaultData() {
  const cat = (name, role, key) => ({ id: uid(), name, role, key });
  const frozen = cat("الذهب والدولار", "add", "frozen");
  const cost   = cat("الاستثمار (القيمة الشرائية)", "cost", "cost");
  const online = cat("الأموال البنكية", "add", "online");
  const cash   = cat("السيولة النقدية", "add", "cash");
  const debt   = cat("ديون خارجية", "add", "debt");
  const market = cat("الاستثمار (القيمة السوقية)", "market", "market");
  const categories = [frozen, cost, online, cash, debt, market];
  const a = (name, categoryId) => ({ id: uid(), name, categoryId });
  const assets = [
    a("سبائك الذهب", frozen.id), a("دولار ريدوت", frozen.id),
    a("صندوق الذهب", cost.id), a("بريق", cost.id), a("كلاود", cost.id),
    a("سي آي كابيتال", cost.id), a("بلتون وفرة", cost.id),
    a("انستاباي", online.id), a("فودافون كاش", online.id), a("تيلدا", online.id), a("فوري", online.id),
    a("سيولة", cash.id), a("محفظة", cash.id),
    a("سلف", debt.id), a("المحل", debt.id),
    a("صندوق الذهب", market.id), a("بريق", market.id), a("كلاود", market.id),
    a("سي آي كابيتال", market.id), a("بلتون وفرة", market.id),
  ];
  return {
    categories, assets, entries: {}, log: {},
    goals: defaultGoals(), finalGoal: { target: "", monthlyRate: "", dailyRate: "" },
    dailyTarget: "", debts: { people: [] },
    gold: { purchasePerGram: "", quantity: "", currentPerGram: "" },
    pages: defaultPages(), theme: "light", appName: "إدارة الثروة",
  };
}
function normalize(d) {
  if (!d) return defaultData();
  const NAME_TO_KEY = { "المجمدات": "frozen", "الذهب والدولار": "frozen", "الاستثمار (القيمة الشرائية)": "cost", "أونلاين": "online", "الأموال البنكية": "online", "نقدي": "cash", "السيولة النقدية": "cash", "ديون خارجية": "debt", "الاستثمار (القيمة السوقية)": "market" };
  const RENAME = { "المجمدات": "الذهب والدولار", "أونلاين": "الأموال البنكية", "نقدي": "السيولة النقدية" };
  const baseCats = Array.isArray(d.categories) && d.categories.length ? d.categories : defaultData().categories;
  const cats = baseCats.map((c) => ({ ...c, key: c.key || NAME_TO_KEY[c.name], name: RENAME[c.name] || c.name }));
  return {
    log: {}, goals: defaultGoals(), finalGoal: { target: "", monthlyRate: "", dailyRate: "" },
    dailyTarget: "", debts: { people: [] }, theme: "light", appName: "إدارة الثروة",
    ...d,
    categories: cats,
    debts: d.debts && Array.isArray(d.debts.people) ? d.debts : { people: [] },
    pages: { ...defaultPages(), ...(d.pages || {}) },
  };
}

/* ---------- التخزين ---------- */
async function loadData() {
  try { const v = localStorage.getItem(STORAGE_KEY); if (v) return JSON.parse(v); } catch (e) {}
  return null;
}
async function persist(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* ---------- أدوات ---------- */
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function shiftDate(str, days) {
  const d = new Date(str + "T00:00:00"); d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
const num = (v) => { const n = Number(v); return isNaN(n) ? 0 : n; };
const fmt = (n) => num(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
// تنظيف ما يكتبه المستخدم: أرقام ونقطة عشرية واحدة فقط (بدون فواصل)
function sanitizeNum(input) {
  let s = String(input == null ? "" : input).replace(/,/g, "").replace(/[^\d.]/g, "");
  const i = s.indexOf(".");
  if (i !== -1) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, "");
  return s;
}
// إضافة فاصلة الآلاف للعرض مع الحفاظ على ما يكتبه المستخدم
function withCommas(s) {
  if (s === "" || s == null) return "";
  const dot = s.includes(".");
  let [intp, decp] = s.split(".");
  const intFmt = intp === "" ? "" : Number(intp).toLocaleString("en-US");
  if (dot) return (intFmt === "" ? "0" : intFmt) + "." + (decp ?? "");
  return intFmt;
}
// اختصار الأرقام الكبيرة لمحاور الرسوم
function compactNum(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(Math.round(n));
}
function fmtDateAr(str) { if (!str) return ""; const [y, m, d] = str.split("-"); return `${num(d)} ${AR_MONTHS[num(m) - 1]} ${y}`; }
function fmtTime(ts) { if (!ts) return "—"; try { return new Date(ts).toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); } catch (e) { return "—"; } }
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const daysInYear = (y) => (((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365);

/* ---------- حسابات الثروة ---------- */
function goldProfit(g) { return (num(g.currentPerGram) - num(g.purchasePerGram)) * num(g.quantity); }
function categoryTotal(data, date, categoryId) {
  const day = data.entries[date] || {};
  return data.assets.filter((x) => x.categoryId === categoryId).reduce((s, x) => s + num(day[x.id]), 0);
}
function dayTotals(data, date) {
  const byCat = {}; let add = 0, market = 0, cost = 0, debt = 0;
  data.categories.forEach((c) => {
    const t = categoryTotal(data, date, c.id); byCat[c.id] = t;
    if (c.role === "add") add += t; else if (c.role === "market") market += t;
    else if (c.role === "cost") cost += t; else if (c.role === "subtract") debt += t;
  });
  const gp = goldProfit(data.gold);
  return { byCat, add, market, cost, debt, investProfit: market - cost, goldProfit: gp, total: add + market - debt + gp };
}
function entryDates(data) { return Object.keys(data.entries).filter((d) => Object.keys(data.entries[d] || {}).length > 0).sort(); }
function totalsByDate(data) { return entryDates(data).map((d) => ({ date: d, total: dayTotals(data, d).total })); }
function totalAtOrBefore(s, ds) { let v = null; for (let i = 0; i < s.length; i++) { if (s[i].date <= ds) v = s[i].total; else break; } return v; }
function previousRecordedDate(data, date) { const ds = entryDates(data).filter((d) => d < date); return ds.length ? ds[ds.length - 1] : null; }
function dayChange(data, date) {
  const total = dayTotals(data, date).total;
  const prevDate = previousRecordedDate(data, date);
  if (prevDate === null) return { hasPrev: false, total, prevDate: null, prevTotal: 0, diff: 0, pct: 0 };
  const prevTotal = dayTotals(data, prevDate).total;
  const diff = total - prevTotal;
  return { hasPrev: true, total, prevDate, prevTotal, diff, pct: prevTotal !== 0 ? (diff / Math.abs(prevTotal)) * 100 : 0 };
}
function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function periodBaseline(series, startStr) {
  if (!series.length) return 0;
  const before = totalAtOrBefore(series, shiftDate(startStr, -1));
  if (before !== null) return before;
  const within = series.find((s) => s.date >= startStr);
  return within ? within.total : series[series.length - 1].total;
}
function cumulativeChange(data, date, scope) {
  const series = totalsByDate(data);
  const total = dayTotals(data, date).total;
  const [y, m] = date.split("-").map(Number);
  const startStr = scope === "month" ? `${y}-${pad(m)}-01` : `${y}-01-01`;
  const baseline = periodBaseline(series, startStr);
  const diff = total - baseline;
  return { total, baseline, diff, pct: baseline !== 0 ? (diff / Math.abs(baseline)) * 100 : 0 };
}
function allTimeMax(data, excludeDate) {
  const s = totalsByDate(data).filter((x) => x.date !== excludeDate);
  return s.length ? Math.max(...s.map((x) => x.total)) : null;
}

/* ---------- الديون ---------- */
function personBalance(p) { return (p.transactions || []).reduce((s, t) => s + (t.type === "loan" ? num(t.amount) : -num(t.amount)), 0); }
function debtsTotal(data) { return (((data.debts && data.debts.people) || [])).reduce((s, p) => s + personBalance(p), 0); }

/* ---------- الأهداف ---------- */
function goalTargetFor(data, scope) {
  const dt = num(data.dailyTarget); const now = new Date();
  if (scope === "monthly") return dt * daysInMonth(now.getFullYear(), now.getMonth());
  if (scope === "yearly") return dt * daysInYear(now.getFullYear());
  return dt;
}
function daysLeftInScope(scope) {
  const now = new Date();
  if (scope === "monthly") return daysInMonth(now.getFullYear(), now.getMonth()) - now.getDate() + 1;
  if (scope === "yearly") {
    const end = new Date(now.getFullYear(), 11, 31);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((end - today) / 86400000) + 1;
  }
  return 1;
}
function goalProgress(data, goal) {
  const series = totalsByDate(data);
  const currentTotal = series.length ? series[series.length - 1].total : 0;
  const now = new Date(); let baseline = currentTotal;
  if (series.length) {
    if (goal.scope === "daily") baseline = series.length > 1 ? series[series.length - 2].total : currentTotal;
    else if (goal.scope === "monthly") baseline = periodBaseline(series, `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01`);
    else if (goal.scope === "yearly") baseline = periodBaseline(series, `${now.getFullYear()}-01-01`);
  }
  const achieved = currentTotal - baseline;
  const target = goalTargetFor(data, goal.scope);
  const remaining = target - achieved;
  const pct = target > 0 ? (achieved / target) * 100 : 0;
  let leftLabel, leftValue, perLabel, perValue;
  if (goal.scope === "yearly") {
    const monthsLeft = 12 - now.getMonth();
    leftLabel = "الأشهر المتبقية"; leftValue = monthsLeft + " شهر";
    perLabel = "المطلوب شهريًا"; perValue = remaining > 0 && monthsLeft > 0 ? remaining / monthsLeft : 0;
  } else if (goal.scope === "monthly") {
    const daysLeft = daysLeftInScope("monthly");
    leftLabel = "الأيام المتبقية"; leftValue = daysLeft + " يوم";
    perLabel = "المطلوب يوميًا"; perValue = remaining > 0 && daysLeft > 0 ? remaining / daysLeft : 0;
  } else {
    leftLabel = "ينتهي"; leftValue = "اليوم";
    perLabel = "المطلوب اليوم"; perValue = remaining > 0 ? remaining : 0;
  }
  return { achieved, target, remaining, pct, leftLabel, leftValue, perLabel, perValue, currentTotal };
}
function avgRates(data) {
  const series = totalsByDate(data);
  if (series.length < 2) return { daily: 0, monthly: 0 };
  const first = series[0], last = series[series.length - 1];
  const days = Math.max(daysBetween(first.date, last.date), 1);
  const daily = (last.total - first.total) / days;
  return { daily, monthly: daily * 30 };
}
function finalProjection(data, fg) {
  fg = fg || {};
  const series = totalsByDate(data);
  const currentTotal = series.length ? series[series.length - 1].total : 0;
  const target = num(fg.target);
  const remaining = target - currentTotal;
  const auto = avgRates(data);
  const dt = num(data.dailyTarget);
  const dAuto = dt > 0 ? dt : auto.daily;
  const mAuto = dt > 0 ? dt * 30 : auto.monthly;
  const dailyRate = fg.dailyRate !== "" && fg.dailyRate != null ? num(fg.dailyRate) : dAuto;
  const monthlyRate = fg.monthlyRate !== "" && fg.monthlyRate != null ? num(fg.monthlyRate) : mAuto;
  const pct = target > 0 ? (currentTotal / target) * 100 : 0;
  const eta = (rate, unit) => {
    if (target <= 0) return { state: "none" };
    if (remaining <= 0) return { state: "reached" };
    if (rate <= 0) return { state: "unknown" };
    const periods = remaining / rate;
    const days = Math.ceil(unit === "day" ? periods : periods * 30);
    const d = new Date(); d.setDate(d.getDate() + days);
    return { state: "ok", periods, date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` };
  };
  return { currentTotal, target, remaining, pct, dailyRate, monthlyRate, dAuto, mAuto, etaDaily: eta(dailyRate, "day"), etaMonthly: eta(monthlyRate, "month") };
}
function colorForPct(p) {
  if (p >= 100) return "#1E875A";
  if (p >= 75) return "#3CA06B";
  if (p >= 50) return "#C99A3A";
  if (p >= 25) return "#D98032";
  return "#C0392B";
}
const CARD_HUES = [205, 150, 32, 268, 8, 188, 322, 95, 245, 52];
function tintHue(h, dark) {
  return dark
    ? { bg: `hsl(${h} 34% 16%)`, fg: `hsl(${h} 65% 73%)`, br: `hsl(${h} 32% 27%)` }
    : { bg: `hsl(${h} 72% 96%)`, fg: `hsl(${h} 55% 35%)`, br: `hsl(${h} 60% 87%)` };
}
function cardTint(i, dark) { return tintHue(CARD_HUES[i % CARD_HUES.length], dark); }
// ألوان ثابتة لكروت «الأهم»: ذهبي/أصفر، أحمر، أخضر، أزرق
const KEY_HUE = { frozen: 46, debt: 6, cash: 145, online: 212 };
// ألوان صناديق صفحة الإدخال: الديون أحمر، السوقية برتقالي، الشرائية رمادي
function dailyTint(key, dark) {
  if (key === "debt") return tintHue(6, dark);
  if (key === "market") return tintHue(28, dark);
  if (key === "cost") return dark ? { bg: "hsl(220 8% 18%)", fg: "hsl(220 9% 72%)", br: "hsl(220 8% 30%)" } : { bg: "hsl(220 14% 95%)", fg: "hsl(220 8% 42%)", br: "hsl(220 12% 85%)" };
  return null;
}

/* ============================================================
   التطبيق
============================================================ */
function App() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("dashboard");
  const [prevView, setPrevView] = useState("dashboard");
  const [date, setDate] = useState(todayStr());
  const [lastSaved, setLastSaved] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    let live = true;
    loadData().then((d) => { if (!live) return; setData(normalize(d)); setLoaded(true); });
    return () => { live = false; };
  }, []);
  useEffect(() => {
    if (!loaded || !data) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => { persist(data); setLastSaved(Date.now()); }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [data, loaded]);

  /* عمليات */
  const updateEntry = (d, assetId, raw) => setData((p) => {
    const entries = { ...p.entries }; const day = { ...(entries[d] || {}) };
    if (raw === "" || raw === null || raw === undefined) delete day[assetId]; else day[assetId] = String(raw);
    if (Object.keys(day).length === 0) delete entries[d]; else entries[d] = day;
    return { ...p, entries };
  });
  const addAsset = (name, categoryId) => setData((p) => ({ ...p, assets: [...p.assets, { id: uid(), name, categoryId }] }));
  const updateAsset = (id, patch) => setData((p) => ({ ...p, assets: p.assets.map((x) => x.id === id ? { ...x, ...patch } : x) }));
  const deleteAsset = (id) => setData((p) => {
    const entries = {}; Object.keys(p.entries).forEach((d) => { const day = { ...p.entries[d] }; delete day[id]; if (Object.keys(day).length) entries[d] = day; });
    return { ...p, assets: p.assets.filter((x) => x.id !== id), entries };
  });
  const addCategory = (name, role) => setData((p) => ({ ...p, categories: [...p.categories, { id: uid(), name, role }] }));
  const updateCategory = (id, patch) => setData((p) => ({ ...p, categories: p.categories.map((c) => c.id === id ? { ...c, ...patch } : c) }));
  const deleteCategory = (id) => setData((p) => {
    const ids = p.assets.filter((a) => a.categoryId === id).map((a) => a.id);
    const entries = {}; Object.keys(p.entries).forEach((d) => { const day = { ...p.entries[d] }; ids.forEach((x) => delete day[x]); if (Object.keys(day).length) entries[d] = day; });
    return { ...p, categories: p.categories.filter((c) => c.id !== id), assets: p.assets.filter((a) => a.categoryId !== id), entries };
  });
  const setGold = (patch) => setData((p) => ({ ...p, gold: { ...p.gold, ...patch } }));
  const addGoal = (name, scope) => setData((p) => ({ ...p, goals: [...(p.goals || []), { id: uid(), name, scope }] }));
  const updateGoal = (id, patch) => setData((p) => ({ ...p, goals: (p.goals || []).map((g) => g.id === id ? { ...g, ...patch } : g) }));
  const deleteGoal = (id) => setData((p) => ({ ...p, goals: (p.goals || []).filter((g) => g.id !== id) }));
  const setFinalGoal = (patch) => setData((p) => ({ ...p, finalGoal: { ...(p.finalGoal || {}), ...patch } }));
  const setDailyTarget = (v) => setData((p) => ({ ...p, dailyTarget: v }));
  const logDay = (d) => setData((p) => ({ ...p, log: { ...(p.log || {}), [d]: { savedAt: new Date().toISOString() } } }));
  const deleteDate = (d) => setData((p) => { const entries = { ...p.entries }; delete entries[d]; const log = { ...(p.log || {}) }; delete log[d]; return { ...p, entries, log }; });
  const resetAll = () => setData(defaultData());
  const toggleTheme = () => setData((p) => ({ ...p, theme: p.theme === "dark" ? "light" : "dark" }));
  const setPageName = (key, name) => setData((p) => ({ ...p, pages: { ...(p.pages || {}), [key]: name } }));
  const setAppName = (name) => setData((p) => ({ ...p, appName: name }));
  const importData = (obj) => setData(normalize(obj));
  const peopleOps = {
    addPerson: (name) => setData((p) => ({ ...p, debts: { people: [...(p.debts.people || []), { id: uid(), name, transactions: [] }] } })),
    deletePerson: (id) => setData((p) => ({ ...p, debts: { people: (p.debts.people || []).filter((x) => x.id !== id) } })),
    renamePerson: (id, name) => setData((p) => ({ ...p, debts: { people: (p.debts.people || []).map((x) => x.id === id ? { ...x, name } : x) } })),
    addTx: (pid, tx) => setData((p) => ({ ...p, debts: { people: (p.debts.people || []).map((x) => x.id === pid ? { ...x, transactions: [...(x.transactions || []), { id: uid(), ...tx }] } : x) } })),
    updateTx: (pid, txid, patch) => setData((p) => ({ ...p, debts: { people: (p.debts.people || []).map((x) => x.id === pid ? { ...x, transactions: (x.transactions || []).map((t) => t.id === txid ? { ...t, ...patch } : t) } : x) } })),
    deleteTx: (pid, txid) => setData((p) => ({ ...p, debts: { people: (p.debts.people || []).map((x) => x.id === pid ? { ...x, transactions: (x.transactions || []).filter((t) => t.id !== txid) } : x) } })),
  };

  const api = { addAsset, updateAsset, deleteAsset, addCategory, updateCategory, deleteCategory, setGold, addGoal, updateGoal, deleteGoal, setFinalGoal, setDailyTarget, logDay, deleteDate, resetAll, toggleTheme, setPageName, setAppName, importData, ...peopleOps };

  if (!loaded || !data) return (<div className="app" dir="rtl"><style>{CSS}</style><div className="loading">جارٍ التحميل…</div></div>);
  const dark = data.theme === "dark";

  return (
    <div className={"app" + (dark ? " dark" : "")} dir="rtl">
      <style>{CSS}</style>
      <header className="topbar">
        <div className="brand"><span className="brand-mark">◆</span><span className="brand-name">{data.appName}</span></div>
        <nav className="tabs">
          {[["debts", data.pages.debts], ["dashboard", data.pages.dashboard], ["goals", data.pages.goals]].map(([k, label]) => (
            <button key={k} className={"tab" + (view === k ? " active" : "")} onClick={() => setView(k)}
              style={view === k ? { background: TAB_ACCENT[k], color: "#fff", boxShadow: `0 4px 12px -4px ${TAB_ACCENT[k]}` } : undefined}>{label}</button>
          ))}
        </nav>
        <div className="topbar-actions">
          <span className="saved-info" title={"آخر حفظ تلقائي: " + fmtTime(lastSaved)}>{lastSaved ? "✓" : "…"}</span>
          <button className="icon-top" onClick={toggleTheme} title="تبديل المظهر">{dark ? "☀" : "☾"}</button>
          <button className="icon-top" onClick={() => { if (view !== "settings") setPrevView(view); setView("settings"); }} title="الإعدادات">⚙</button>
        </div>
      </header>

      <main className="container">
        {view === "dashboard" && <DashboardView data={data} dark={dark} pages={data.pages} onGoEntries={() => setView("entries")} onGoLog={() => setView("log")} />}
        {view === "entries" && <DailyView data={data} date={date} setDate={setDate} updateEntry={updateEntry} logDay={logDay} api={api} pages={data.pages} onGoLog={() => setView("log")} onGoDash={() => setView("dashboard")} />}
        {view === "log" && <LogView data={data} api={api} pages={data.pages} onBack={() => setView("entries")} gotoDate={(d) => { setDate(d); setView("entries"); }} />}
        {view === "debts" && <DebtsView data={data} api={api} />}
        {view === "goals" && <GoalsView data={data} api={api} />}
        {view === "settings" && <SettingsView data={data} api={api} lastSaved={lastSaved} onBack={() => setView(prevView || "dashboard")} gotoDate={(d) => { setDate(d); setView("entries"); }} />}
      </main>
    </div>
  );
}

/* ---------- زر تأكيد داخلي (بديل عن confirm) ---------- */
function ConfirmButton({ label = "حذف", confirmLabel = "اضغط للتأكيد", onConfirm, className = "btn-ghost danger sm", title }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3000); return () => clearTimeout(t); }, [armed]);
  return (
    <button type="button" className={className + (armed ? " armed" : "")} title={title}
      onClick={() => { if (armed) { onConfirm(); setArmed(false); } else setArmed(true); }}>
      {armed ? confirmLabel : label}
    </button>
  );
}

/* ============================================================
   الإدخالات اليومية (آخر اليوم)
============================================================ */

  const t = useMemo(() => dayTotals(data, date), [data, date]);
  const change = useMemo(() => dayChange(data, date), [data, date]);
  const mtd = useMemo(() => cumulativeChange(data, date, "month"), [data, date]);
  const ytd = useMemo(() => cumulativeChange(data, date, "year"), [data, date]);
  const maxOther = useMemo(() => allTimeMax(data, date), [data, date]);
  const prevDate = useMemo(() => previousRecordedDate(data, date), [data, date]);
  const prevEntry = (prevDate && data.entries[prevDate]) || {};
  const dTotal = useMemo(() => debtsTotal(data), [data]);
  const gp = t.goldProfit;
  const dark = data.theme === "dark";
  const goldTint = tintHue(46, dark);
  const isLogged = !!(data.log && data.log[date]);

  const isAllTimeHigh = hasValues && (maxOther === null || t.total >= maxOther);
  const isRecord = hasValues && maxOther !== null && t.total > maxOther;
  useEffect(() => { setJustSaved(false); }, [date]);

  const ghostsFor = (a) => {
    const g = [];
    if (a.name === "سلف" && dTotal > 0) g.push({ label: "إجمالي السلف", value: dTotal });
    if (prevEntry[a.id] != null && prevEntry[a.id] !== "") g.push({ label: "أمس", value: prevEntry[a.id] });
    return g;
  };

  return (
    <div className="daily">
      <div className="entries-actions">
        <button className="btn-ghost sm" onClick={onGoDash}>‹ {pages.dashboard}</button>
        <button className="btn-ghost sm" onClick={onGoLog}>{pages.log} ›</button>
      </div>

      <div className="datebar card">
        <button className="nav-day" onClick={() => setDate(shiftDate(date, 1))} title="اليوم التالي">›</button>
        <div className="datebar-mid">
          <label className="datebar-label">يوم الإدخال</label>
          <input className="date-input" type="date" value={date} onChange={(e) => setDate(e.target.value || todayStr())} />
          <span className="date-pretty">{fmtDateAr(date)}</span>
        </div>
        <button className="nav-day" onClick={() => setDate(shiftDate(date, -1))} title="اليوم السابق">‹</button>
      </div>

      <div className="day-summary">
        <div className="ds-main">
          <span className="ds-label">ثروة هذا اليوم</span>
          <span className="ds-value">{fmt(t.total)} <span className="cur">ج.م</span></span>
        </div>
        <div className="ds-chips">
          <Chip label="القيمة السوقية" value={t.market} tone="pos" />
          <Chip label="أرباح الاستثمار" value={t.investProfit} tone="auto" />
          <Chip label="أرباح الذهب" value={gp} tone="auto" />
        </div>
      </div>

      <section className="card compare-card">
        <div className="compare-main">
          {change.hasPrev ? (
            <>
              <div className={"verdict " + (change.diff > 0 ? "pos" : change.diff < 0 ? "neg" : "flat")}>
                <span className="verdict-arrow">{change.diff > 0 ? "▲" : change.diff < 0 ? "▼" : "•"}</span>
                <span>{change.diff > 0 ? "مكسب" : change.diff < 0 ? "خسارة" : "لا تغيير"}</span>
              </div>
              <div className="compare-nums">
                <span className={"compare-diff " + (change.diff >= 0 ? "pos" : "neg")}>{change.diff > 0 ? "+" : change.diff < 0 ? "−" : ""}{fmt(Math.abs(change.diff))} ج.م</span>
                <span className={"compare-pct " + (change.diff >= 0 ? "pos" : "neg")}>({change.pct > 0 ? "+" : ""}{fmt(change.pct)}%)</span>
              </div>
              <div className="compare-context">مقارنةً بيوم <b>{fmtDateAr(change.prevDate)}</b> ({fmt(change.prevTotal)} ← {fmt(change.total)} ج.م)</div>
            </>
          ) : (
            <div className="compare-first">{hasValues ? "هذا أول يوم تُسجِّله — لا يوجد يوم سابق للمقارنة." : "أدخِل أرصدة اليوم ثم احفظ السجل لبدء المقارنة."}</div>
          )}
        </div>
        <div className="compare-actions">
          {isLogged && <span className="logged-badge">✓ محفوظ</span>}
          <button className="btn-save" onClick={() => { logDay(date); setJustSaved(true); }} disabled={!hasValues}>{isLogged ? "تحديث سجل اليوم" : "حفظ سجل اليوم"}</button>
        </div>
        {justSaved && (
          <div className="save-toast">تم حفظ سجل {fmtDateAr(date)}.
            {change.hasPrev ? <> النتيجة: <b className={change.diff >= 0 ? "pos" : "neg"}>{change.diff >= 0 ? "مكسب" : "خسارة"} {fmt(Math.abs(change.diff))} ج.م</b> عن اليوم السابق.</> : <> وهو أول يوم في السجل.</>}
            {isRecord && <b className="pos"> 🏆 رقم قياسي جديد للثروة!</b>}
          </div>
        )}
        <div className="cumulative-row">
          <CumChip label="منذ بداية الشهر" diff={mtd.diff} pct={mtd.pct} />
          <CumChip label="منذ بداية السنة" diff={ytd.diff} pct={ytd.pct} />
          {isAllTimeHigh && hasValues && <span className="record-badge">🏆 أعلى ثروة مسجَّلة</span>}
        </div>
      </section>

      <div className="cat-grid">
        {[...data.categories].sort((a, b) => ((a.role === "market" ? 1 : a.role === "cost" ? 2 : 0) - (b.role === "market" ? 1 : b.role === "cost" ? 2 : 0))).map((c) => {
          const assets = data.assets.filter((a) => a.categoryId === c.id);
          const sub = t.byCat[c.id] || 0; const tone = ROLES[c.role]?.tone || "neutral";
          const dt = dailyTint(c.key, dark);
          return (
            <section className="card cat-card" key={c.id} style={dt ? { background: dt.bg, borderColor: dt.br } : undefined}>
              <div className="cat-head" style={dt ? { borderColor: dt.br } : undefined}>
                <div className="cat-title"><span className="cat-name" style={dt ? { color: dt.fg } : undefined}>{c.name}</span><span className={"role-badge " + tone}>{ROLES[c.role]?.label || c.role}</span></div>
                <span className={"cat-sub " + tone} style={dt ? { color: dt.fg } : undefined}>{fmt(sub)} ج.م</span>
              </div>
              <div className="rows">
                {assets.length === 0 && <div className="empty-row">لا توجد أصول بعد.</div>}
                {assets.map((a) => (
                  <AssetRow key={a.id} asset={a} value={(data.entries[date] || {})[a.id] ?? ""} ghosts={ghostsFor(a)}
                    onValue={(v) => updateEntry(date, a.id, v)} editing={editId === a.id} onToggleEdit={() => setEditId(editId === a.id ? null : a.id)}
                    categories={data.categories} onRename={(name) => api.updateAsset(a.id, { name })}
                    onMove={(cid) => { api.updateAsset(a.id, { categoryId: cid }); setEditId(null); }} onDelete={() => { api.deleteAsset(a.id); setEditId(null); }} />
                ))}
              </div>
              {addingCat === c.id
                ? <AddAssetInline onAdd={(name) => { if (name.trim()) api.addAsset(name.trim(), c.id); setAddingCat(null); }} onCancel={() => setAddingCat(null)} />
                : <button className="add-row" onClick={() => setAddingCat(c.id)}>+ إضافة أصل</button>}
            </section>
          );
        })}
      </div>

      <section className="card gold-card" style={goldTint ? { background: goldTint.bg, borderColor: goldTint.br } : undefined}>
        <div className="cat-head" style={goldTint ? { borderColor: goldTint.br } : undefined}>
          <div className="cat-title"><span className="cat-name" style={goldTint ? { color: goldTint.fg } : undefined}>إعداد الذهب (السبائك)</span><span className="role-badge neutral">يُحتسب ربحه ضمن الثروة</span></div>
          <span className={"cat-sub " + (gp >= 0 ? "pos" : "neg")}>{gp >= 0 ? "+" : ""}{fmt(gp)} ج.م</span>
        </div>
        <div className="gold-grid">
          <GoldField label="سعر شراء الجرام" value={data.gold.purchasePerGram} onChange={(v) => api.setGold({ purchasePerGram: v })} />
          <GoldField label="الكمية (جرام)" value={data.gold.quantity} onChange={(v) => api.setGold({ quantity: v })} />
          <GoldField label="سعر الجرام الحالي" value={data.gold.currentPerGram} onChange={(v) => api.setGold({ currentPerGram: v })} />
        </div>
        <div className="gold-calc">
          <span>تكلفة الشراء: <b>{fmt(num(data.gold.purchasePerGram) * num(data.gold.quantity))}</b> ج.م</span>
          <span>القيمة الحالية: <b>{fmt(num(data.gold.currentPerGram) * num(data.gold.quantity))}</b> ج.م</span>
          <span className={gp >= 0 ? "pos" : "neg"}>الربح/الخسارة: <b>{gp >= 0 ? "+" : ""}{fmt(gp)}</b> ج.م</span>
        </div>
      </section>
    </div>
  );
}

function Chip({ label, value, tone }) {
  const cls = tone === "auto" ? (num(value) >= 0 ? "pos" : "neg") : tone;
  const sign = tone === "auto" && num(value) >= 0 ? "+" : "";
  return (<div className="chip"><span className="chip-label">{label}</span><span className={"chip-value " + cls}>{sign}{fmt(value)} ج.م</span></div>);
}
function CumChip({ label, diff, pct }) {
  const cls = diff >= 0 ? "pos" : "neg"; const sign = diff > 0 ? "+" : diff < 0 ? "−" : "";
  return (<div className="cum-chip"><span className="cum-label">{label}</span><span className={"cum-val " + cls}>{sign}{fmt(Math.abs(diff))} ج.م <span className="cum-pct">({pct > 0 ? "+" : ""}{fmt(pct)}%)</span></span></div>);
}
function AssetRow({ asset, value, ghosts, onValue, editing, onToggleEdit, categories, onRename, onMove, onDelete }) {
  return (
    <div className={"row" + (editing ? " editing" : "")}>
      {!editing ? (
        <>
          <span className="row-name">{asset.name}</span>
          <div className="row-input-wrap">
            {ghosts && ghosts.length > 0 && (
              <div className="ghosts">
                {ghosts.map((g, i) => (
                  <button key={i} type="button" className="ghost" title="اضغط للتعبئة بنفس الرقم" onClick={() => onValue(String(g.value))}>{g.label}: {fmt(g.value)}</button>
                ))}
              </div>
            )}
            <MoneyInput className="row-input" placeholder="0" value={value} onChange={(v) => onValue(v)} />
          </div>
          <button className="row-edit" onClick={onToggleEdit} title="تعديل / نقل / حذف">⋯</button>
        </>
      ) : (
        <div className="edit-panel">
          <input className="edit-name" defaultValue={asset.name} onBlur={(e) => e.target.value.trim() && onRename(e.target.value.trim())} />
          <label className="edit-move">نقل إلى:
            <select value={asset.categoryId} onChange={(e) => onMove(e.target.value)}>{categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
          </label>
          <div className="edit-actions">
            <ConfirmButton label="حذف الأصل" onConfirm={onDelete} />
            <button className="btn-ghost sm" onClick={onToggleEdit}>تم</button>
          </div>
        </div>
      )}
    </div>
  );
}
function AddAssetInline({ onAdd, onCancel }) {
  const [name, setName] = useState("");
  return (<div className="add-inline"><input autoFocus className="row-input wide" placeholder="اسم الأصل الجديد" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onAdd(name)} /><button className="btn-primary sm" onClick={() => onAdd(name)}>إضافة</button><button className="btn-ghost sm" onClick={onCancel}>إلغاء</button></div>);
}
function GoldField({ label, value, onChange }) {
  return (<label className="gold-field"><span>{label}</span><MoneyInput placeholder="0" value={value} onChange={onChange} /></label>);
}
// خانة مبلغ مع فاصلة آلاف أثناء الكتابة
function MoneyInput({ value, onChange, placeholder, className = "", inputRef }) {
  const display = withCommas(sanitizeNum(value ?? ""));
  return (
    <input ref={inputRef} type="text" inputMode="decimal" dir="ltr" className={"money-input " + className}
      placeholder={placeholder} value={display}
      onChange={(e) => onChange(sanitizeNum(e.target.value))} />
  );
}

/* ============================================================
   لوحة التحكم
============================================================ */
function DashboardView({ data, dark, pages, onGoEntries, onGoLog }) {
  const dates = useMemo(() => entryDates(data), [data]);
  const latest = dates[dates.length - 1] || todayStr();
  const snap = useMemo(() => dayTotals(data, latest), [data, latest]);
  const series = useMemo(() => totalsByDate(data), [data]);
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const years = useMemo(() => { const ys = new Set(dates.map((d) => num(d.split("-")[0]))); ys.add(now.getFullYear()); return Array.from(ys).sort(); }, [dates]);
  const monthData = useMemo(() => { const dim = daysInMonth(year, month); const out = []; for (let d = 1; d <= dim; d++) { const ds = `${year}-${pad(month + 1)}-${pad(d)}`; out.push({ label: String(d), total: totalAtOrBefore(series, ds) }); } return out; }, [series, year, month]);
  const yearData = useMemo(() => { const out = []; for (let m = 0; m < 12; m++) { const ds = `${year}-${pad(m + 1)}-${pad(daysInMonth(year, m))}`; out.push({ label: AR_MONTHS[m], total: totalAtOrBefore(series, ds) }); } return out; }, [series, year]);
  const mStats = statsFrom(monthData.map((x) => x.total));
  const yStats = statsFrom(yearData.map((x) => x.total));
  const spark = series.slice(-30).map((x, i) => ({ i, total: x.total }));

  const grid = dark ? "#283242" : "#EEF0F4";
  const axis = dark ? "#8995A6" : "#7A8597";
  const lineCol = dark ? "#E0C07A" : "#16233F";
  const barCol = dark ? "#C79A4F" : "#16233F";
  const cursor = dark ? "#1E2630" : "#F4F6F9";

  const catByKey = {}; data.categories.forEach((c) => { if (c.key) catByKey[c.key] = c; });

        <span className="hero-date">{dates.length ? "حتى " + fmtDateAr(latest) : "لا توجد بيانات بعد"}</span>
        <div className="hero-spark">

                <Area type="monotone" dataKey="total" stroke="#D9B877" strokeWidth={2} fill="url(#sg)" />
              </AreaChart>
            </ResponsiveContainer>
          ) : <div className="spark-empty">أدخِل بيانات عدة أيام لرؤية اتجاه الثروة</div>}

            </div>
          );
        })}
      </div>

      {(catByKey.market || catByKey.cost) && (() => {
        const ti = cardTint(5, dark); const mv = catByKey.market ? (snap.byCat[catByKey.market.id] || 0) : 0; const cv = catByKey.cost ? (snap.byCat[catByKey.cost.id] || 0) : 0;

                  <div className="invest-row"><span style={{ color: ti.fg }}>القيمة الشرائية</span><b style={{ color: ti.fg }}>{fmt(cv)} ج.م</b></div>

                <span className="metric-pct">القيمة السوقية = {fmt(pctOf(mv))}% من الثروة</span>

          </>

      {others.length > 0 && (
        <>
          <h3 className="metric-section-title">تصنيفات أخرى</h3>

            {others.map((c, i) => { const ti = cardTint(i + 6, dark); const v = snap.byCat[c.id] || 0; return (

function statsFrom(arr) {
  const v = arr.filter((x) => x !== null && x !== undefined);
  if (!v.length) return { count: 0, growth: 0, growthPct: 0, max: 0, min: 0, avg: 0 };
  const first = v[0], last = v[v.length - 1], growth = last - first;
  return { count: v.length, growth, growthPct: first !== 0 ? (growth / Math.abs(first)) * 100 : 0, max: Math.max(...v), min: Math.min(...v), avg: v.reduce((s, x) => s + x, 0) / v.length };
}
function Stat({ label, value, tone, signed, pct, tint }) {
  const cls = tone === "auto" ? (num(value) >= 0 ? "pos" : "neg") : "neutral";
  const sign = signed && num(value) >= 0 ? "+" : "";
  const style = tint ? { background: tint.bg, borderColor: tint.br } : undefined;
  return (<div className="stat" style={style}><span className="stat-label" style={tint ? { color: tint.fg } : undefined}>{label}</span><span className={"stat-value " + cls}>{sign}{fmt(value)}{pct ? "%" : <span className="s-cur"> ج.م</span>}</span></div>);
}
function TT({ active, payload, label, unit }) {
  if (!active || !payload || !payload.length || payload[0].value == null) return null;
  return (<div className="tt"><div className="tt-label">{label}</div><div className="tt-val">{fmt(payload[0].value)} {unit}</div></div>);
}
function Empty({ children }) { return <div className="empty-chart">{children}</div>; }

function Ring({ pct, achieved, size = 150 }) {
  const r = size / 2 - 13, circ = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  const off = circ * (1 - clamped / 100); const col = colorForPct(pct);
  return (
    <div className="ring-box" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth="13" style={{ stroke: "var(--track)" }} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth="13" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset .6s ease, stroke .4s ease" }} />
      </svg>
      <div className="ring-center"><span className="ring-ach" style={{ color: col }}>{fmt(achieved)}</span><span className="ring-cur">ج.م المُحقَّق</span><span className="ring-pct" style={{ color: col }}>{fmt(Math.max(0, pct))}%</span></div>
    </div>
  );
}
function FinalRing({ pct, current, target, size = 196 }) {
  const r = size / 2 - 16, circ = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  const off = circ * (1 - clamped / 100);
  return (
    <div className="final-ring" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <defs>
          <linearGradient id="fgGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor="var(--brass-soft)" />
            <stop offset="100%" stopColor="var(--brass)" />
          </linearGradient>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth="16" style={{ stroke: "var(--track)" }} />
        <circle className="fg-progress" cx={size / 2} cy={size / 2} r={r} fill="none" stroke="url(#fgGrad)" strokeWidth="16" strokeLinecap="round" strokeDasharray={circ}
          transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ "--circ": circ + "px", "--off": off + "px", strokeDashoffset: off }} />
      </svg>
      <div className="final-ring-center">
        <span className="fr-pct">{fmt(Math.max(0, clamped))}%</span>
        <span className="fr-cur">{fmt(current)}</span>
        <span className="fr-of">من {fmt(target)} ج.م</span>
      </div>
    </div>
  );
}

        <input className="goal-name" defaultValue={goal.name} onBlur={(e) => e.target.value.trim() && api.updateGoal(goal.id, { name: e.target.value.trim() })} />
        <select className="goal-scope" value={goal.scope} onChange={(e) => api.updateGoal(goal.id, { scope: e.target.value })}><option value="daily">يومي</option><option value="monthly">شهري</option><option value="yearly">سنوي</option></select>
        <ConfirmButton label="✕" confirmLabel="تأكيد" onConfirm={() => api.deleteGoal(goal.id)} className="goal-del" title="حذف الهدف" />
      </div>
      <div className="goal-body">
        <Ring pct={p.pct} achieved={p.achieved} />
        <div className="goal-stats">
          <div className="gs-target"><span>الهدف ({SCOPE_LABEL[goal.scope]})</span><b>{fmt(p.target)} ج.م</b></div>
          <div className="gs-line"><span>المتبقي</span><b className={p.remaining <= 0 ? "pos" : "neg"}>{fmt(Math.max(0, p.remaining))} ج.م</b></div>
          <div className="gs-line"><span>{p.leftLabel}</span><b>{p.leftValue}</b></div>
          <div className="gs-line"><span>{p.perLabel}</span><b className="brass">{fmt(p.perValue)} ج.م</b></div>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   الإعدادات
============================================================ */
function SettingsView({ data, api, lastSaved, onBack, gotoDate }) {
  const [tab, setTab] = useState("general");
  const [newCatName, setNewCatName] = useState("");
  const [newCatRole, setNewCatRole] = useState("add");
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const fileRef = useRef(null);
  const dates = entryDates(data).slice().reverse();
  const PAGE_KEYS = [["dashboard", "لوحة التحكم"], ["entries", "الإدخالات اليومية"], ["log", "السجل اليومي"], ["debts", "الديون"], ["goals", "الأهداف"]];

  const doExport = () => {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `tharwa-backup-${todayStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) { setImportMsg("تعذّر التنزيل — انسخ النص بالأسفل بدلًا من ذلك."); }
  };
  const applyImport = (text) => {
    try { const obj = JSON.parse(text); if (!obj || typeof obj !== "object") throw 0; api.importData(obj); setImportMsg("تم الاستيراد بنجاح ✓"); setImportText(""); }
    catch (e) { setImportMsg("النص غير صالح — تأكد أنه ملف نسخة احتياطية صحيح."); }
  };
  const onFile = (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = () => applyImport(String(reader.result)); reader.readAsText(f); e.target.value = ""; };

  return (
    <div className="settings-page">
      <button className="back-btn" onClick={onBack}>‹ رجوع</button>
      <div className="settings-card card">
        <div className="settings-head"><h2 className="settings-title">الإعدادات</h2></div>
        <div className="seg">
          {[["general", "عام"], ["pages", "أسماء الصفحات"], ["categories", "التصنيفات"], ["assets", "الأصول"], ["gold", "الذهب"], ["history", "البيانات التاريخية"], ["backup", "نسخة احتياطية"]].map(([k, l]) => (
            <button key={k} className={"seg-btn" + (tab === k ? " active" : "")} onClick={() => setTab(k)}>{l}</button>
          ))}
        </div>
        <div className="settings-body">
          {tab === "general" && (
            <div className="settings-block">
              <div className="set-row"><div><b>اسم التطبيق (بالأعلى)</b><div className="set-hint">يظهر أعلى يمين الشاشة.</div></div><input className="set-input" defaultValue={data.appName} onBlur={(e) => api.setAppName(e.target.value.trim() || "إدارة الثروة")} /></div>
              <div className="set-row"><div><b>المظهر</b><div className="set-hint">الوضع الحالي: {data.theme === "dark" ? "داكن" : "فاتح"}</div></div><button className="btn-ghost" onClick={api.toggleTheme}>التبديل إلى {data.theme === "dark" ? "الفاتح ☀" : "الداكن ☾"}</button></div>
              <div className="set-row"><div><b>الحفظ التلقائي</b><div className="set-hint">يُحفظ تلقائيًّا بعد كل تعديل بثوانٍ.</div></div><span className="save-stamp">آخر حفظ: {fmtTime(lastSaved)}</span></div>
            </div>
          )}
          {tab === "pages" && (
            <div className="settings-block">
              <p className="hint">عدّل اسم أي صفحة؛ يظهر فورًا في الأعلى وفي الأزرار.</p>
              <div className="list">{PAGE_KEYS.map(([k, def]) => (
                <div className="list-item" key={k}><span className="page-key">{def}</span><input className="li-name" defaultValue={(data.pages || {})[k] || def} onBlur={(e) => api.setPageName(k, e.target.value.trim() || def)} /></div>
              ))}</div>
            </div>
          )}
          {tab === "backup" && (
            <div className="settings-block">
              <div className="set-row"><div><b>تصدير نسخة احتياطية</b><div className="set-hint">احفظ كل بياناتك في ملف.</div></div><button className="btn-primary" onClick={doExport}>تنزيل الملف</button></div>
              <label className="bk-label">أو انسخ النص يدويًّا:</label>
              <textarea className="bk-area" readOnly value={JSON.stringify(data)} onFocus={(e) => e.target.select()} />
              <div className="set-row"><div><b>استيراد نسخة احتياطية</b><div className="set-hint">سيستبدل كل البيانات الحالية.</div></div><button className="btn-ghost" onClick={() => fileRef.current && fileRef.current.click()}>اختيار ملف</button></div>
              <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={onFile} />
              <label className="bk-label">أو الصق نص النسخة هنا:</label>
              <textarea className="bk-area" placeholder='{"categories": ...}' value={importText} onChange={(e) => setImportText(e.target.value)} />
              <ConfirmButton label="استيراد واستبدال البيانات" confirmLabel="اضغط للتأكيد" onConfirm={() => applyImport(importText)} className="btn-ghost danger" />
              {importMsg && <div className="bk-msg">{importMsg}</div>}
            </div>
          )}
          {tab === "categories" && (
            <div className="settings-block">
              <div className="add-card"><input placeholder="اسم التصنيف الجديد" value={newCatName} onChange={(e) => setNewCatName(e.target.value)} /><select value={newCatRole} onChange={(e) => setNewCatRole(e.target.value)}>{Object.entries(ROLES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select><button className="btn-primary" onClick={() => { if (newCatName.trim()) { api.addCategory(newCatName.trim(), newCatRole); setNewCatName(""); } }}>إضافة</button></div>
              <div className="list">{data.categories.map((c) => (<div className="list-item" key={c.id}><input className="li-name" defaultValue={c.name} onBlur={(e) => e.target.value.trim() && api.updateCategory(c.id, { name: e.target.value.trim() })} /><select value={c.role} onChange={(e) => api.updateCategory(c.id, { role: e.target.value })}>{Object.entries(ROLES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select><ConfirmButton onConfirm={() => api.deleteCategory(c.id)} /></div>))}</div>
            </div>
          )}
          {tab === "assets" && (
            <div className="settings-block">
              {data.categories.map((c) => (<div className="asset-group" key={c.id}><div className="ag-head">{c.name}</div>{data.assets.filter((a) => a.categoryId === c.id).map((a) => (<div className="list-item" key={a.id}><input className="li-name" defaultValue={a.name} onBlur={(e) => e.target.value.trim() && api.updateAsset(a.id, { name: e.target.value.trim() })} /><select value={a.categoryId} onChange={(e) => api.updateAsset(a.id, { categoryId: e.target.value })}>{data.categories.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}</select><ConfirmButton onConfirm={() => api.deleteAsset(a.id)} /></div>))}<AddAssetSettings onAdd={(name) => api.addAsset(name, c.id)} /></div>))}
            </div>
          )}
          {tab === "gold" && (
            <div className="settings-block">
              <div className="gold-grid"><GoldField label="سعر شراء الجرام" value={data.gold.purchasePerGram} onChange={(v) => api.setGold({ purchasePerGram: v })} /><GoldField label="الكمية (جرام)" value={data.gold.quantity} onChange={(v) => api.setGold({ quantity: v })} /><GoldField label="سعر الجرام الحالي" value={data.gold.currentPerGram} onChange={(v) => api.setGold({ currentPerGram: v })} /></div>
              <div className="gold-calc"><span>تكلفة الشراء: <b>{fmt(num(data.gold.purchasePerGram) * num(data.gold.quantity))}</b> ج.م</span><span>القيمة الحالية: <b>{fmt(num(data.gold.currentPerGram) * num(data.gold.quantity))}</b> ج.م</span><span className={goldProfit(data.gold) >= 0 ? "pos" : "neg"}>الربح/الخسارة: <b>{fmt(goldProfit(data.gold))}</b> ج.م</span></div>
            </div>
          )}
          {tab === "history" && (
            <div className="settings-block">
              <p className="hint">لتعديل يوم سابق افتحه ثم عدّل المدخلات مباشرة.</p>
              <div className="list">{dates.length === 0 && <div className="empty-row">لا توجد أيام مُدخلة بعد.</div>}{dates.map((d) => (<div className="list-item history" key={d}><span className="hist-date">{fmtDateAr(d)}</span><span className="hist-total">{fmt(dayTotals(data, d).total)} ج.م</span><button className="btn-ghost sm" onClick={() => gotoDate(d)}>فتح</button><ConfirmButton onConfirm={() => api.deleteDate(d)} /></div>))}</div>
              <div className="reset-zone"><ConfirmButton label="إعادة ضبط كل البيانات" confirmLabel="اضغط للتأكيد النهائي" onConfirm={api.resetAll} className="btn-ghost danger" /></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
function AddAssetSettings({ onAdd }) {
  const [name, setName] = useState("");
  return (<div className="add-inline tight"><input placeholder="أصل جديد" value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && name.trim()) { onAdd(name.trim()); setName(""); } }} /><button className="btn-primary sm" onClick={() => { if (name.trim()) { onAdd(name.trim()); setName(""); } }}>إضافة</button></div>);
}

.add-card input{ flex:1; min-width:140px; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:14px; }
.list{ display:flex; flex-direction:column; gap:8px; }
.list-item{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.li-name{ flex:1; min-width:120px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; }
.asset-group{ border:1px solid var(--line); border-radius:12px; padding:12px; }
.ag-head{ font-family:'Cairo'; font-weight:700; font-size:14.5px; margin-bottom:10px; color:var(--brass); }
.list-item.history{ background:var(--bg); border-radius:10px; padding:8px 12px; }
.hist-date{ flex:1; font-weight:600; font-size:14px; }
.hist-total{ font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:13.5px; }
.reset-zone{ margin-top:10px; padding-top:14px; border-top:1px solid var(--line); }

@media (max-width:720px){
  .topbar{ flex-wrap:wrap; }
  .tabs{ order:3; width:100%; margin:0; }
  .tab{ flex:1; }
  .hero{ grid-template-columns:1fr; }
  .day-summary{ flex-direction:column; align-items:flex-start; }
  .fg-grid{ grid-template-columns:1fr; }
  .fg-proj{ grid-template-columns:1fr; }
  .record-badge{ margin-inline-start:0; }
  .log-row-head{ display:none; }
  .log-row{ grid-template-columns:1fr 1fr; gap:8px 12px; }
  .lr-actions{ grid-column:1 / -1; justify-self:stretch; }
  .lr-actions .btn-ghost, .lr-actions button{ flex:1; }
  .log-row span[data-label]::before{ content:attr(data-label) "‏: "; color:var(--muted); font-size:11px; font-weight:600; display:block; margin-bottom:2px; }
  .tx-row{ grid-template-columns:auto 1fr auto; row-gap:6px; }
  .tx-note{ grid-column:1 / -1; }
}
`;


try {
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
} catch (e) {
  document.getElementById("root").innerHTML =
    '<pre style="padding:16px;direction:ltr;white-space:pre-wrap;color:#C0392B;font-size:12px">' +
    String((e && e.stack) || e) + "</pre>";
}
</script>
