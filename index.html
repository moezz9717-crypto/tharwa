const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap');
*{ box-sizing:border-box; margin:0; padding:0; }
/* استجابة أسرع للمس ومنع تكبير iOS عند الكتابة */
button, a, .tab, .metric, .person-row, .seg-btn, .nav-day, label{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
input:not([type=checkbox]):not([type=radio]):not([type=date]), textarea{ font-size:16px !important; touch-action:manipulation; }
select{ font-size:16px !important; }
input[type=date]{ font-size:15px; }
.app{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#FBFBFC; --line:#E4E7EC; --hover:#E1E5EB; --track:#ECEEF2;
  --ink:#14181F; --ink-soft:#3A4250; --muted:#7A8597; --topbar:rgba(255,255,255,.86);
  --navy:#16233F; --navy-2:#1E3057; --brass:#B4894A; --brass-soft:#D9B877;
  --green:#1E875A; --red:#C0392B; --green-bg:#E8F4EE; --red-bg:#FBEAE8;
  font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; line-height:1.5;
  -webkit-font-smoothing:antialiased; transition:background .3s, color .3s;
}
.app.dark{
  --bg:#0F141B; --surface:#171E27; --surface-2:#1F2832; --line:#2A333F; --hover:#243040; --track:#27313D;
  --ink:#E8EDF3; --ink-soft:#BAC3CF; --muted:#7F8B9A; --topbar:rgba(15,20,27,.88);
  --navy:#1B2A47; --navy-2:#22386A; --brass:#C79A4F; --brass-soft:#E0C07A;
  --green:#3CB07A; --red:#E0685C; --green-bg:#13301F; --red-bg:#3A201D;
}
.loading{ display:grid; place-items:center; min-height:100vh; color:var(--muted); font-size:18px; }
.pos{ color:var(--green); } .neg{ color:var(--red); } .neutral{ color:var(--ink-soft); }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
input, select, textarea{ font-family:inherit; color:var(--ink); background:var(--surface-2); }
b{ font-weight:700; }

.topbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px; padding:calc(12px + env(safe-area-inset-top)) clamp(14px,4vw,40px) 12px; background:var(--topbar); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.topbar-spacer{ flex:1; }
/* شريط التنقّل السفلي */
.bottomnav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; align-items:flex-end; justify-content:space-around; gap:2px; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:var(--topbar); backdrop-filter:blur(14px); border-top:1px solid var(--line); }
.bn-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:none; padding:7px 2px; border-radius:14px; font-family:'Cairo','Tajawal'; font-weight:800; font-size:10.5px; transition:background .15s, opacity .15s; opacity:.62; }
.bn-item.active{ opacity:1; }
.bn-item svg{ opacity:.95; }
.bn-item span{ line-height:1; }
.bn-add{ flex:0 0 auto; width:58px; height:58px; margin-top:-22px; border-radius:50%; background:linear-gradient(135deg,var(--brass),var(--brass-deep,#C9962F)); color:#1a1205; border:4px solid var(--bg); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -6px rgba(217,184,119,.7); }
.bn-add:active{ transform:scale(.92); }
.set-pdf-btns{ display:flex; gap:8px; }
.brand{ display:flex; align-items:center; gap:8px; }
.brand-mark{ color:var(--brass); font-size:18px; }
.brand-name{ font-family:'Cairo'; font-weight:800; font-size:19px; }
.tabs{ display:flex; gap:4px; margin-inline:auto; background:var(--line); padding:4px; border-radius:12px; }
.tab{ padding:8px 16px; border-radius:9px; font-weight:600; font-size:14px; color:var(--ink-soft); transition:.18s; }
.tab.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.saved-info{ color:var(--green); font-size:13px; font-weight:700; width:18px; text-align:center; }
.icon-top{ width:40px; height:40px; border-radius:11px; background:var(--surface); border:1px solid var(--line); font-size:17px; color:var(--ink-soft); transition:.18s; }
.icon-top:hover{ color:var(--ink); }
.container{ max-width:1040px; margin:0 auto; padding:clamp(16px,3vw,30px) clamp(14px,4vw,40px) 104px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; }

/* أزرار */
.btn-primary{ background:var(--navy); color:#fff; border-radius:10px; padding:9px 16px; font-weight:600; font-size:14px; transition:.15s; }
.btn-primary:hover{ filter:brightness(1.1); }
.btn-primary.sm, .btn-ghost.sm{ padding:7px 12px; font-size:13px; }
.btn-ghost{ background:var(--bg); color:var(--ink-soft); border-radius:10px; padding:9px 14px; font-weight:600; font-size:14px; }
.btn-ghost:hover{ background:var(--hover); }
.btn-ghost.danger{ color:var(--red); background:var(--red-bg); }
.btn-ghost.danger.armed{ background:var(--red); color:#fff; }
.back-btn{ position:fixed; top:calc(64px + env(safe-area-inset-top)); left:10px; z-index:60; display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:50%; padding:0; font-weight:800; font-size:0; margin:0; box-shadow:0 4px 14px -4px rgba(0,0,0,.4); }
.back-btn::before{ content:"‹"; font-size:22px; line-height:1; margin-top:-2px; }
.back-btn:hover{ color:var(--brass); border-color:var(--brass); }
.back-btn:hover{ background:var(--hover); }

/* ===== الإدخالات ===== */
.daily{ display:flex; flex-direction:column; gap:18px; }
.entries-actions{ display:flex; justify-content:space-between; gap:8px; }
.datebar{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; }
.nav-day{ width:38px; height:38px; border-radius:11px; background:var(--bg); color:var(--ink); font-size:22px; font-weight:700; }
.nav-day:hover{ background:var(--hover); }
.datebar-mid{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; }
.datebar-label{ color:var(--muted); font-size:13px; }
.date-input{ border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:14px; }
.date-pretty{ font-family:'Cairo'; font-weight:700; color:var(--brass); }
.day-summary{ background:linear-gradient(135deg,var(--navy),var(--navy-2)); border-radius:16px; padding:20px 22px; color:#fff; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
.ds-label{ display:block; color:#A9B6CE; font-size:13px; margin-bottom:4px; }
.ds-value{ font-family:'Cairo'; font-weight:800; font-size:clamp(26px,5vw,38px); color:var(--brass-soft); }
.ds-value .cur, .hero-cur, .log-latest .cur, .debts-total-val .cur{ font-size:15px; color:#C7B488; font-weight:600; }
.ds-chips{ display:flex; gap:10px; flex-wrap:wrap; }
.chip{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:11px; padding:8px 12px; min-width:96px; }
.chip-label{ display:block; font-size:11px; color:#A9B6CE; margin-bottom:2px; }
.chip-value{ font-weight:700; font-size:14px; }
.chip-value.pos{ color:#7CD3A6; } .chip-value.neg{ color:#F0A39A; }

.cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
.cat-card{ padding:16px; display:flex; flex-direction:column; }
.cat-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
.cat-title{ display:flex; flex-direction:column; gap:5px; }
.cat-name{ font-family:'Cairo'; font-weight:700; font-size:16px; }
.role-badge{ font-size:11px; padding:2px 8px; border-radius:20px; width:fit-content; background:var(--bg); color:var(--muted); }
.role-badge.pos{ background:var(--green-bg); color:var(--green); }
.role-badge.neg{ background:var(--red-bg); color:var(--red); }
.cat-sub{ font-family:'Cairo'; font-weight:800; font-size:17px; white-space:nowrap; }
.cat-sub.neg{ color:var(--red); }
.rows{ display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; align-items:flex-start; gap:10px; }
.row-name{ flex:1; font-size:14.5px; color:var(--ink-soft); padding-top:8px; }
.row-input-wrap{ display:flex; flex-direction:column; align-items:stretch; gap:3px; width:140px; }
.ghosts{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.ghost{ font-size:11px; color:var(--muted); background:var(--bg); border:1px dashed var(--line); border-radius:7px; padding:2px 7px; font-variant-numeric:tabular-nums; }
.ghost:hover{ color:var(--brass); border-color:var(--brass); }
.row-input{ width:100%; text-align:left; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; font-variant-numeric:tabular-nums; transition:.15s; }
.row-input.wide{ flex:1; width:auto; }
.row-input:focus, .date-input:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(180,137,74,.14); }
.row-edit{ width:30px; height:34px; border-radius:8px; color:var(--muted); font-size:18px; }
.row-edit:hover{ background:var(--bg); color:var(--ink); }
.empty-row{ color:var(--muted); font-size:13px; padding:6px 2px; }
.row.editing{ background:var(--bg); border-radius:10px; padding:10px; }
.edit-panel{ display:flex; flex-direction:column; gap:10px; width:100%; }
.edit-name{ border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; }
.edit-move{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.edit-move select{ flex:1; border:1px solid var(--line); border-radius:9px; padding:7px; }
.edit-actions{ display:flex; gap:8px; justify-content:flex-end; }
.add-row{ margin-top:12px; align-self:flex-start; color:var(--brass); font-weight:600; font-size:13.5px; padding:6px 4px; }
.add-inline{ display:flex; gap:8px; margin-top:12px; align-items:center; }
.add-inline.tight{ margin-top:8px; }
.add-inline input{ flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; }
.gold-card{ padding:16px; }
.gold-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px; }
.gold-field{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); }
.gold-field input{ border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:14px; font-variant-numeric:tabular-nums; }
.gold-field input:focus{ outline:none; border-color:var(--brass); }
.gold-calc{ display:flex; flex-wrap:wrap; gap:16px; font-size:13.5px; color:var(--ink-soft); padding-top:12px; border-top:1px solid var(--line); }
.hint{ color:var(--muted); font-size:12.5px; margin-top:10px; }
.hint.center{ text-align:center; }

/* المقارنة */
.compare-card{ padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.compare-main{ display:flex; flex-direction:column; gap:6px; min-width:240px; }
.verdict{ display:flex; align-items:center; gap:8px; font-family:'Cairo'; font-weight:800; font-size:17px; }
.verdict.pos{ color:var(--green); } .verdict.neg{ color:var(--red); } .verdict.flat{ color:var(--muted); }
.verdict-arrow{ font-size:13px; }
.compare-nums{ display:flex; align-items:baseline; gap:8px; }
.compare-diff{ font-family:'Cairo'; font-weight:800; font-size:22px; font-variant-numeric:tabular-nums; }
.compare-pct{ font-size:14px; font-weight:700; }
.compare-context{ color:var(--muted); font-size:12.5px; }
.compare-first{ color:var(--ink-soft); font-size:14px; }
.compare-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.logged-badge{ color:var(--green); background:var(--green-bg); border-radius:20px; padding:4px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
.btn-save{ background:var(--brass); color:#1a1205; border-radius:11px; padding:11px 20px; font-family:'Cairo'; font-weight:800; font-size:15px; transition:.15s; }
.btn-save:hover{ filter:brightness(1.06); }
.btn-save:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }
.save-toast{ flex-basis:100%; margin-top:6px; padding:10px 14px; background:var(--bg); border-radius:11px; font-size:13.5px; color:var(--ink-soft); }
.cumulative-row{ flex-basis:100%; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:4px; padding-top:12px; border-top:1px dashed var(--line); }
.cum-chip{ background:var(--bg); border-radius:11px; padding:8px 12px; }
.cum-label{ display:block; font-size:11px; color:var(--muted); margin-bottom:2px; }
.cum-val{ font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; }
.cum-pct{ font-size:12px; font-weight:600; opacity:.85; }
.record-badge{ margin-inline-start:auto; background:linear-gradient(135deg,#FBEFD2,#F3DDA6); color:#7A5A12; border:1px solid #E7CD8E; border-radius:20px; padding:6px 13px; font-weight:800; font-size:12.5px; font-family:'Cairo'; }

/* ===== لوحة التحكم ===== */
.dash{ display:flex; flex-direction:column; gap:18px; }
.dash-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.act{ flex:1; min-width:96px; border-radius:13px; padding:13px 16px; font-family:'Cairo'; font-weight:800; font-size:15px; transition:.15s; text-align:center; box-shadow:0 6px 16px -8px rgba(0,0,0,.4); }
.act:hover{ filter:brightness(1.07); transform:translateY(-1px); }
.act:active{ transform:scale(.97); }
.act-add{ background:linear-gradient(135deg,#2EA067,#23824F); color:#fff; }
.act-log{ background:linear-gradient(135deg,#2D6CB5,#21528E); color:#fff; }
.act-pdf{ background:linear-gradient(135deg,#C9962F,#A8761B); color:#fff; width:100%; }
.report-drop{ flex:1; min-width:96px; }
.dash-cta{ background:var(--brass); color:#1a1205; border-radius:12px; padding:12px 22px; font-family:'Cairo'; font-weight:800; font-size:15px; transition:.15s; }
.dash-cta:hover{ filter:brightness(1.06); }
.hero{ background:linear-gradient(135deg,var(--navy),var(--navy-2)); border-radius:22px; padding:28px clamp(20px,4vw,34px); color:#fff; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; position:relative; overflow:hidden; }
.privacy-btn{ position:absolute; top:12px; inset-inline-start:12px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; z-index:3; transition:.15s; }
.privacy-btn:hover{ background:rgba(255,255,255,.22); }
.privacy-btn:active{ transform:scale(.9); }
.blurable{ transition:filter .2s ease; }
.dash.privacy .blurable{ filter:blur(9px); user-select:none; pointer-events:none; }
.dash.privacy .hero-value.blurable{ filter:blur(13px); padding:6px 22px; -webkit-mask-image:radial-gradient(ellipse 78% 62% at 50% 50%, #000 50%, transparent 100%); mask-image:radial-gradient(ellipse 78% 62% at 50% 50%, #000 50%, transparent 100%); }
.hero::before{ content:""; position:absolute; inset-inline:0; top:0; height:4px; background:linear-gradient(90deg,transparent,var(--brass),transparent); }
.hero-eyebrow{ font-family:'Tajawal'; font-weight:700; color:#C7D2E6; font-size:21px; letter-spacing:.2px; }
.hero-value{ font-family:'Tajawal'; font-weight:900; font-size:clamp(36px,8vw,58px); color:var(--brass-soft); line-height:1.02; }
.hero-date{ color:#8C9ABB; font-size:12.5px; }
.hero-spark{ width:100%; margin-top:6px; }
/* شريط أسعار الذهب أسفل كرت الثروة */
.gold-strip{ width:100%; margin-top:14px; display:flex; align-items:center; gap:10px; background:rgba(217,184,119,.14); border:1px solid rgba(217,184,119,.3); border-radius:14px; padding:11px 14px; color:#F0DFB0; }
.gold-strip:active{ transform:scale(.99); }
.gs-label{ font-family:'Cairo'; font-weight:800; font-size:13.5px; color:var(--brass-soft); }
.gs-mid{ flex:1; text-align:center; font-size:13.5px; color:#E8EEF7; }
.gs-mid b{ font-family:'Cairo'; font-weight:800; color:#F0DFB0; font-variant-numeric:tabular-nums; }
.gs-arrow{ font-size:18px; color:var(--brass-soft); }
/* صفحة أسعار الذهب */
.gold-page{ display:flex; flex-direction:column; gap:12px; }
.gold-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.gold-refresh{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-weight:700; font-size:13px; color:var(--brass); }
.gold-refresh:disabled{ opacity:.5; }
.gold-sub{ font-size:12.5px; color:var(--muted); margin:0; }
.gold-table{ padding:6px 12px; }
.gt-row{ display:grid; grid-template-columns:1.2fr 1fr 1fr; align-items:center; padding:13px 4px; border-bottom:1px solid var(--line); }
.gt-row:last-child{ border-bottom:none; }
.gt-head{ font-size:12px; color:var(--muted); font-weight:700; }
.gt-head .gt-c{ font-weight:700; }
.gt-k{ font-family:'Cairo'; font-weight:800; font-size:15px; }
.gt-c{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
.gt-c b{ font-family:'Cairo'; font-weight:800; font-variant-numeric:tabular-nums; font-size:16px; }
.gd{ font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums; }
.gd.up{ color:#2EA067; } .gd.down{ color:var(--red); }
.gd-flat{ font-size:11px; color:var(--muted); }
.gt-usd .gt-k{ color:var(--brass); }
.gt-usd{ background:rgba(217,184,119,.08); border-radius:10px; }
.gold-time{ text-align:center; font-size:12px; color:var(--muted); margin:0; }
.gold-stale{ text-align:center; font-size:12px; color:var(--red); background:rgba(224,82,78,.1); border-radius:8px; padding:8px; }
.spark-empty{ color:#8C9ABB; font-size:13px; text-align:center; padding:18px 0; }
.metrics, .metrics-top{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.metrics-bottom{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.metrics-bottom .metric{ align-items:stretch; }
/* إصلاح المربع الغريب على الرسم الدائري */
.recharts-wrapper, .recharts-surface, .recharts-sector, .recharts-pie-sector path, .recharts-layer, g, path { outline:none !important; }
.recharts-wrapper :focus, .recharts-surface :focus { outline:none !important; }
.metric{ border:1px solid var(--line); border-radius:15px; padding:13px 12px; text-align:center; display:flex; flex-direction:column; gap:5px; align-items:center; transition:transform .15s, box-shadow .25s; position:relative; overflow:hidden; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.metric:hover{ transform:translateY(-2px); }
.metric:active{ transform:scale(.985); }
.metric > span, .metric > .invest-rows, .metric > .invest-profit{ position:relative; z-index:1; }
.metric-icon{ position:absolute; z-index:0; width:40px; height:40px; top:50%; inset-inline-start:11px; transform:translateY(-50%); opacity:.16; pointer-events:none; animation:iconFloat 5s ease-in-out infinite; }
@keyframes iconFloat{ 0%,100%{ transform:translateY(-50%) rotate(0); } 50%{ transform:translateY(-58%) rotate(-4deg); } }
.metric::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:radial-gradient(circle at 50% 45%, currentColor, transparent 62%); opacity:0; pointer-events:none; mix-blend-mode:soft-light; }
.metric:active::after{ animation:metricGlow .6s ease-out; }
@keyframes metricGlow{ 0%{ opacity:0; } 30%{ opacity:.55; } 100%{ opacity:0; } }
.metric-label{ font-family:'Tajawal'; font-weight:700; font-size:14px; }
.editable-name{ cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
.editable-name .edit-pen{ font-size:.7em; opacity:0; transition:opacity .15s; }
.editable-name:hover .edit-pen, .editable-name:active .edit-pen{ opacity:.55; }
.inline-edit{ border:1px solid var(--brass); border-radius:8px; padding:3px 8px; font-family:inherit; font-size:inherit; font-weight:inherit; color:inherit; background:var(--surface); min-width:80px; max-width:100%; }
.inline-edit:focus{ outline:none; box-shadow:0 0 0 2px rgba(217,184,119,.3); }
.brand .inline-edit{ font-family:'Reem Kufi','Cairo'; }
.metric-value{ font-family:'Tajawal'; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; }
.m-cur, .s-cur{ font-size:12px; font-weight:600; opacity:.7; }
.metric-pct{ font-family:'Tajawal'; font-weight:600; font-size:11.5px; color:var(--muted); }
.metric-extra{ font-family:'Tajawal'; font-weight:700; font-size:12px; opacity:.92; padding-top:5px; margin-top:1px; border-top:1px dashed currentColor; width:100%; }
.metric-section-title{ font-family:'Tajawal'; font-weight:800; font-size:16px; color:var(--muted); margin:6px 2px -4px; }
.invest-card{ align-items:stretch !important; text-align:right; gap:8px !important; padding:14px 15px; }
.invest-card .metric-icon{ inset-inline-start:auto; inset-inline-end:12px; width:34px; height:34px; }
.invest-rows{ display:flex; flex-direction:column; gap:7px; }
.comp-ic{ width:17px; height:17px; vertical-align:-3px; opacity:.8; }
.invest-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:'Tajawal'; font-weight:600; font-size:14px; }
.invest-row b{ font-family:'Tajawal'; font-weight:800; font-variant-numeric:tabular-nums; }
.invest-profit{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:8px; border-top:1px dashed var(--line); font-family:'Tajawal'; font-weight:700; font-size:14px; color:var(--ink-soft); }
.invest-profit b{ font-family:'Tajawal'; font-weight:800; font-variant-numeric:tabular-nums; }
.panel{ padding:18px clamp(14px,3vw,22px); }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.panel-title{ font-family:'Tajawal'; font-weight:800; font-size:19px; }
.pickers{ display:flex; gap:8px; }
.pickers select, .goal-add select, .add-card select, .list-item select, .goal-scope{ border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:14px; background:var(--bg); font-weight:600; }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
.stat{ border:1px solid var(--line); border-radius:14px; padding:13px 14px; text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; }
.stat-label{ font-family:'Tajawal'; font-weight:700; font-size:13.5px; }
.stat-value{ font-family:'Tajawal'; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; }
.chart-wrap{ margin-top:8px; }
.empty-chart{ display:grid; place-items:center; height:200px; color:var(--muted); font-size:14px; background:var(--bg); border-radius:12px; }
/* تكوين الثروة */
.comp-list{ display:flex; flex-direction:column; gap:14px; }
.comp-item{ display:flex; flex-direction:column; gap:6px; }
.comp-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14px; }
.comp-name{ font-family:'Tajawal'; font-weight:700; }
.comp-val{ color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:13px; }
.comp-track{ height:13px; border-radius:8px; background:var(--bg); overflow:hidden; }
.comp-fill{ height:100%; border-radius:8px; transition:width .5s ease; min-width:4px; }
/* مقارنة شهر بشهر */
.cmp-grid{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; }
.cmp-side{ background:var(--bg); border-radius:14px; padding:14px; text-align:center; }

.cmp-mid{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:90px; }
.cmp-arrow{ font-size:13px; }
.cmp-diff{ font-family:'Cairo'; font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; }
.cmp-pct{ font-size:12.5px; font-weight:700; }
/* تقرير */
.report-btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
.report-btns .btn-ghost{ flex:1; min-width:90px; text-align:center; padding:12px; font-weight:700; }
.tt{ background:var(--navy); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; box-shadow:0 8px 20px -8px rgba(0,0,0,.4); }
.tt-label{ color:#9DAAC4; font-size:11px; margin-bottom:3px; }
.tt-val{ font-weight:700; color:var(--brass-soft); }
.tt-chg{ font-size:12px; font-weight:700; margin-top:3px; }
.tt-chg.muted{ color:#9DAAC4; font-weight:500; }
/* زر التقرير المنسدل */
.report-drop{ position:relative; }
.report-menu{ position:absolute; top:calc(100% + 6px); inset-inline-start:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 28px -10px rgba(0,0,0,.35); z-index:30; overflow:hidden; min-width:130px; }
.report-menu button{ display:block; width:100%; text-align:right; padding:11px 16px; font-size:14px; font-weight:600; color:var(--ink); }
.report-menu button:hover{ background:var(--bg); }
/* زر تعبئة أمس بجانب الخانة */
.input-line{ display:flex; align-items:center; gap:6px; }
.prevfill{ width:34px; height:36px; border-radius:9px; background:var(--bg); border:1px solid var(--line); color:var(--brass); font-size:16px; flex-shrink:0; }
.prevfill:hover:not(:disabled){ background:var(--brass); color:#1a1205; }
.prevfill:disabled{ opacity:.35; cursor:not-allowed; }
.input-line .money-input{ flex:1; }
.metric.clickable{ cursor:pointer; }
/* صفحة الاستثمار */
.invest-page{ display:flex; flex-direction:column; gap:14px; }
.invest-summary{ background:linear-gradient(135deg,var(--navy),var(--navy-2)); border-radius:18px; padding:20px 22px; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.is-main{ display:flex; flex-direction:column; gap:3px; }
.is-profit{ font-family:'Cairo'; font-weight:800; font-size:clamp(26px,5vw,36px); }
.is-profit.pos{ color:#7CD3A6; } .is-profit.neg{ color:#F0A39A; }
.is-pct{ font-size:14px; font-weight:700; }
.is-pct.pos{ color:#7CD3A6; } .is-pct.neg{ color:#F0A39A; }
.is-chips{ display:flex; gap:10px; flex-wrap:wrap; }
.fund-list{ display:flex; flex-direction:column; gap:10px; }
.fund-card{ padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.fund-card.clickable{ cursor:pointer; transition:transform .12s, box-shadow .12s; }
.fund-card.clickable:active{ transform:scale(.99); }
.fund-name-static{ flex:1; font-family:'Cairo'; font-weight:700; font-size:16px; }
.fund-mini{ display:flex; gap:10px; }
.fm-item{ flex:1; background:var(--bg); border-radius:10px; padding:9px 11px; display:flex; flex-direction:column; gap:3px; }
.fm-item span{ font-size:11.5px; color:var(--muted); } .fm-item b{ font-family:'Cairo'; font-weight:800; font-variant-numeric:tabular-nums; font-size:14.5px; }
.fund-open{ font-size:12px; color:var(--brass); font-weight:700; text-align:left; }
.fund-manage{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; font-weight:700; font-size:13px; color:var(--brass); }
.gold-link-head{ display:flex; align-items:center; justify-content:space-between; }
.gl-toggle{ width:50px; height:28px; border-radius:999px; background:var(--line); border:none; position:relative; transition:background .2s; padding:0; }
.gl-toggle.on{ background:var(--brass); }

.fund-market.auto{ display:flex; align-items:center; gap:6px; color:var(--brass); }
.auto-tag{ font-size:10px; background:rgba(217,184,119,.18); color:var(--brass); padding:1px 6px; border-radius:6px; font-weight:700; }
.fund-manage:hover{ background:var(--brass); color:#1a1205; border-color:var(--brass); }
.is-sub{ font-size:12px; color:#A9B6CE; }
.metrics-top .metric{ padding:12px 8px; }
.metrics-top .metric-label{ font-size:12.5px; }
.metrics-top .metric-value{ font-size:15px; }
.metrics-top .metric-pct{ font-size:10.5px; }
.metrics-top .metric-icon{ width:32px; height:32px; }
.invest-page-title{ font-family:'Cairo'; font-weight:800; font-size:20px; margin:2px 2px 0; }
.metric-profit{ font-family:'Tajawal'; font-weight:800; font-size:11.5px; font-variant-numeric:tabular-nums; }
.metric-profit.pos{ color:#2EA067; } .metric-profit.neg{ color:var(--red); }
.act-exp{ background:linear-gradient(135deg,#C0392B,#9C2D22); color:#fff; }
/* آلة حاسبة داخل خانة المبلغ */
.money-wrap{ position:relative; display:block; }
.calc-bar{ position:absolute; top:calc(100% + 7px); inset-inline-start:0; inset-inline-end:0; display:grid; grid-template-columns:repeat(6,1fr); gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px; z-index:45; box-shadow:0 16px 36px -14px rgba(0,0,0,.5); }
.calc-bar::before{ content:""; position:absolute; top:-6px; inset-inline-end:20px; width:12px; height:12px; background:var(--surface); border-inline-start:1px solid var(--line); border-top:1px solid var(--line); transform:rotate(45deg); }
.calc-bar button{ height:46px; border-radius:12px; background:var(--bg); color:var(--ink); font-size:20px; font-weight:800; min-width:0; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; transition:transform .08s, background .12s; -webkit-tap-highlight-color:transparent; }
.calc-bar button:active{ transform:scale(.9); }
.calc-bar .calc-op:active{ background:var(--brass); color:#1a1205; border-color:var(--brass); }
.calc-bar .calc-eq{ background:linear-gradient(135deg,#2EA067,#23814F); color:#fff; border:none; font-size:22px; box-shadow:0 4px 12px -4px rgba(46,160,103,.6); }
.calc-bar .calc-eq:active{ transform:scale(.9); filter:brightness(1.05); }
.calc-bar .calc-back{ background:#EEF1F5; color:#5b6577; border-color:transparent; font-size:18px; }
.app.dark .calc-bar .calc-back{ background:#2a3340; color:#c7d0dc; }
/* المصروفات */
.exp-dot{ width:12px; height:12px; border-radius:4px; flex-shrink:0; }
.datebar-log{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:0 12px; font-weight:700; font-size:13px; color:var(--ink); white-space:nowrap; }
.datebar-log.on{ background:var(--brass); color:#1a1205; border-color:var(--brass); }
.exp-bar{ display:flex; align-items:center; gap:10px; }
.exp-bar-item{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 12px; display:flex; flex-direction:column; gap:2px; }
.exp-bar-item span{ font-size:11px; color:var(--muted); }
.exp-bar-item b{ font-family:'Cairo'; font-weight:800; font-variant-numeric:tabular-nums; font-size:15px; }
.exp-bar-item b.neg{ color:var(--red); } .exp-bar-item b.pos{ color:#2EA067; }
.exp-edit-btn{ background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:9px 12px; font-weight:700; font-size:12.5px; color:var(--ink); white-space:nowrap; }
.exp-edit-btn.on{ background:#2EA067; color:#fff; border-color:#2EA067; }
.exp-editrow{ display:flex; justify-content:flex-end; }
.exp-chips{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.exp-chip{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:1.5px solid; border-radius:12px; padding:10px 4px; min-height:58px; transition:.1s; }
.exp-chip:active{ transform:scale(.95); }
.exp-chip-name{ font-family:'Cairo'; font-weight:700; font-size:11.5px; color:var(--ink); text-align:center; line-height:1.15; }
.exp-chip-amt{ font-weight:800; font-size:11px; font-variant-numeric:tabular-nums; }
.exp-chip.editing{ flex-direction:row; gap:5px; padding:8px; }
.exp-rename{ flex:1; min-width:0; border:none; background:transparent; font-family:'Cairo'; font-weight:700; font-size:13px; color:var(--ink); }
.exp-rename:focus{ outline:none; }
.exp-del{ background:transparent; color:var(--red); font-size:15px; padding:2px 4px; }
/* نافذة الإدخال السريع */
.quick-overlay{ position:fixed; inset:0; background:rgba(10,15,25,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .15s ease; }
.quick-overlay.open{ opacity:1; pointer-events:auto; }
.quick-card{ background:var(--surface); border-radius:20px; padding:20px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; box-shadow:0 24px 60px -16px rgba(0,0,0,.5); transform:scale(.92); transition:transform .18s ease; }
.quick-overlay.open .quick-card{ transform:scale(1); }
.quick-head{ display:flex; align-items:center; gap:9px; }
.quick-name{ font-family:'Cairo'; font-weight:800; font-size:19px; }
.quick-sub{ font-size:12.5px; color:var(--muted); margin-top:-4px; }
.quick-input .money-input{ width:100%; font-size:22px !important; text-align:center; padding:14px; font-weight:800; }
.quick-actions{ display:flex; gap:8px; align-items:center; margin-top:30px; flex-wrap:wrap; }
.quick-actions .btn-primary{ flex:1; min-width:90px; }
.exp-log{ padding:16px; margin-top:4px; }
.exp-day{ border-bottom:1px solid var(--line); padding:11px 0; }
.exp-day:last-child{ border-bottom:none; }
.exp-day-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.exp-day-date{ font-family:'Cairo'; font-weight:700; font-size:14px; }
.exp-day-spent{ font-weight:800; color:var(--red); font-variant-numeric:tabular-nums; font-size:13.5px; }
.exp-day-calc{ display:flex; flex-direction:column; gap:3px; margin-top:5px; font-size:12.5px; color:var(--muted); }
.exp-day-calc b.pos{ color:#2EA067; } .exp-day-calc b.neg{ color:var(--red); }
.exp-income b{ font-size:13.5px; }
.exp-income{ color:var(--ink-soft); font-weight:600; }
.rename-row{ display:flex; gap:6px; align-items:center; }
.rename-input{ border:none; border-radius:8px; padding:6px 9px; font-family:'Cairo'; font-weight:700; font-size:16px; }
.btn-light{ background:rgba(255,255,255,.9); color:#16233F; border-radius:8px; padding:6px 12px; font-weight:700; }
.fund-profit small{ font-weight:700; font-size:11px; opacity:.85; margin-inline-start:4px; }
.invest-delete{ margin-top:6px; display:flex; justify-content:center; }
/* نموذج حركة الاستثمار */
.tx-form{ padding:16px; display:flex; flex-direction:column; gap:12px; }
.tx-form-title, .tx-list-title{ font-family:'Cairo'; font-weight:800; font-size:15px; margin:0; }
.tx-type-toggle{ display:flex; gap:8px; }
.tx-type-toggle button{ flex:1; padding:11px; border-radius:11px; border:1px solid var(--line); background:var(--bg); font-weight:700; font-size:14px; color:var(--muted); }
.tx-type-toggle button.active.dep{ background:rgba(46,160,103,.16); border-color:#2EA067; color:#2EA067; }
.tx-type-toggle button.active.wd{ background:rgba(192,57,43,.16); border-color:var(--red); color:var(--red); }
.tx-type-toggle.sm button{ padding:8px; font-size:13px; }
.tx-fields{ display:flex; gap:10px; }
.tx-field{ flex:1; display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); }
.tx-field .date-input, .tx-note{ border:1px solid var(--line); border-radius:9px; padding:10px; font-size:16px; background:var(--surface); color:var(--ink); }
.tx-note:focus, .tx-field .date-input:focus{ outline:none; border-color:var(--brass); }
.tx-list{ display:flex; flex-direction:column; gap:8px; }
.tx-row{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
.tx-row.editing{ flex-direction:column; align-items:stretch; gap:10px; cursor:default; }
.tx-badge{ font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; flex-shrink:0; }
.tx-badge.dep{ background:rgba(46,160,103,.16); color:#2EA067; } .tx-badge.wd{ background:rgba(192,57,43,.16); color:var(--red); }
.tx-mid{ flex:1; display:flex; flex-direction:column; gap:2px; }
.tx-amt{ font-family:'Cairo'; font-weight:800; font-variant-numeric:tabular-nums; font-size:15px; }
.tx-note-text{ font-size:12px; color:var(--muted); }
.tx-date{ font-size:12px; color:var(--muted); flex-shrink:0; }
.tx-row-actions{ display:flex; gap:8px; }
.chip-value.pos{ color:#7CD3A6; } .chip-value.neg{ color:#F0A39A; }
.fund-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.fund-name{ flex:1; min-width:120px; border:1px solid transparent; border-radius:9px; padding:7px 8px; font-family:'Cairo'; font-weight:700; font-size:16px; background:transparent; }
.fund-name:hover{ background:var(--bg); } .fund-name:focus{ outline:none; border-color:var(--line); }
.fund-profit{ font-family:'Cairo'; font-weight:800; font-variant-numeric:tabular-nums; font-size:16px; }
.fund-fields{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fund-field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); }
.fund-field input{ border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:16px; font-variant-numeric:tabular-nums; }
.fund-field input:focus{ outline:none; border-color:var(--brass); }
.fund-market{ background:var(--bg); border-radius:9px; padding:9px 10px; font-family:'Cairo'; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-soft); }
/* صفحة النِّسب الدائرية */
.breakdown-page{ display:flex; flex-direction:column; gap:14px; }
.donut-wrap{ margin-bottom:6px; }
.bd-legend{ display:flex; flex-direction:column; gap:8px; }
.bd-item{ display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:11px; padding:10px 14px; }
.bd-dot{ width:14px; height:14px; border-radius:4px; flex-shrink:0; }
.bd-name{ flex:1; font-family:'Cairo'; font-weight:700; font-size:14.5px; }
.bd-val{ font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:13.5px; }
.bd-pct{ font-family:'Cairo'; font-weight:800; font-size:16px; min-width:54px; text-align:left; }
/* صفحة التقرير */
.report-page{ display:flex; flex-direction:column; gap:14px; }
.report-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.report-toolbar .back-btn{ margin:0; }
.report-sheet{ background:#fff; color:#16233F; border:1px solid var(--line); border-radius:16px; padding:22px; }
.app.dark .report-sheet{ background:#fff; }
.rep-title{ font-family:'Cairo'; font-weight:800; font-size:24px; margin:0; }
.rep-sub{ color:#7A8597; font-size:12.5px; margin-top:4px; }
.rep-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:2px solid #16233F; padding-bottom:12px; margin-bottom:16px; }
.rep-meta{ text-align:left; font-size:11.5px; color:#5A6678; line-height:1.7; }
.rep-h2{ font-family:'Cairo'; font-weight:800; font-size:15px; color:#16233F; margin:18px 0 8px; padding-inline-start:9px; border-inline-start:4px solid #C9962F; }
.rep-total-row td{ font-weight:800; border-top:2px solid #16233F; background:#F7F8FA; }
.rep-swatch{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:6px; vertical-align:middle; }
.rep-foot{ margin-top:20px; padding-top:10px; border-top:1px solid #E4E7EC; text-align:center; font-size:11px; color:#8A95A6; }
.rep-big{ background:linear-gradient(135deg,#16233F,#1E3057); color:#fff; border-radius:14px; padding:18px; text-align:center; margin-bottom:14px; display:flex; flex-direction:column; gap:4px; }
.rep-big-l{ color:#A9B6CE; font-size:13px; } .rep-big-v{ font-family:'Cairo'; font-weight:800; font-size:30px; color:#D9B877; }
.rep-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:16px; }
.rep-c{ border:1px solid #E4E7EC; border-radius:11px; padding:11px; display:flex; flex-direction:column; gap:4px; }
.rep-c span{ color:#7A8597; font-size:11.5px; } .rep-c b{ font-family:'Cairo'; font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; }
.rep-table{ width:100%; border-collapse:collapse; }
.rep-table th, .rep-table td{ padding:9px 8px; border-bottom:1px solid #EEF0F4; font-size:13.5px; text-align:right; }
.rep-table th{ color:#7A8597; font-size:11.5px; }
.rep-table td.n, .rep-table th.n{ text-align:left; font-variant-numeric:tabular-nums; }
@media print{
  .topbar, .no-print, .report-toolbar, .back-btn, .bottomnav{ display:none !important; }
  .app, .container{ background:#fff !important; padding:0 !important; }
  .report-sheet{ border:none; }
}

/* ===== السجل ===== */
.log{ display:flex; flex-direction:column; gap:14px; }
.log-head{ display:flex; gap:30px; padding:18px 22px; flex-wrap:wrap; }
.log-count{ font-family:'Cairo'; font-weight:800; font-size:26px; display:block; }
.log-latest{ font-family:'Cairo'; font-weight:800; font-size:24px; color:var(--brass); display:block; }
.log-empty{ padding:24px; }
.log-list{ display:flex; flex-direction:column; gap:8px; }
.log-row{ display:grid; grid-template-columns:1.3fr 1fr 1.7fr .8fr auto; align-items:center; gap:12px; padding:14px 16px; }
.log-row-head{ background:transparent; border:none; padding:2px 16px; color:var(--muted); font-size:12px; font-weight:600; }
.lr-date{ font-weight:700; font-size:14.5px; }
.lr-total{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--ink-soft); }
.lr-change{ font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; }
.lr-pct{ font-weight:600; font-size:12.5px; opacity:.85; }
.lr-actions{ display:flex; gap:6px; justify-self:end; }
.muted{ color:var(--muted); font-weight:500; }

/* ===== الديون ===== */
.debts, .person{ display:flex; flex-direction:column; gap:16px; }
.debts-total{ padding:20px 24px; text-align:center; }
.debts-total-val{ font-family:'Cairo'; font-weight:800; font-size:clamp(30px,6vw,44px); color:var(--red); display:block; margin-top:6px; }
.people-list{ display:flex; flex-direction:column; gap:8px; }
.person-row{ display:flex; align-items:center; gap:12px; padding:15px 18px; text-align:right; transition:.15s; }
.person-row:hover{ border-color:var(--brass); }
.person-name{ flex:1; font-family:'Cairo'; font-weight:700; font-size:16px; }
.person-bal{ font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; }
.person-bal.owe{ color:var(--red); } .person-bal.clear{ color:var(--green); font-size:13px; }
.chev{ color:var(--muted); font-size:20px; }
.person-head{ padding:18px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.person-title{ flex:1; min-width:140px; border:1px solid transparent; border-radius:9px; padding:7px 8px; font-family:'Cairo'; font-weight:800; font-size:20px; background:transparent; }
.person-title:hover{ background:var(--bg); } .person-title:focus{ outline:none; border-color:var(--line); }
.person-balance{ display:flex; flex-direction:column; gap:3px; align-items:flex-end; }
.person-balance span{ font-size:12px; color:var(--muted); }
.person-balance b{ font-family:'Cairo'; font-weight:800; font-size:22px; font-variant-numeric:tabular-nums; }
.person-balance b.owe{ color:var(--red); } .person-balance b.clear{ color:var(--green); }
.del-person{ }
.tx-add{ padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
.tx-kinds{ display:flex; gap:6px; background:var(--bg); padding:4px; border-radius:11px; width:fit-content; }
.tx-kind-btn{ padding:8px 14px; border-radius:8px; font-weight:600; font-size:13.5px; color:var(--ink-soft); }
.tx-kind-btn.active{ background:var(--navy); color:#fff; }
.tx-fields{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.tx-field{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); }
.tx-field.grow{ flex:1; min-width:140px; }
.tx-field input{ border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:14px; }
.tx-field input:focus{ outline:none; border-color:var(--brass); }
.tx-fullnote{ flex:1; min-width:160px; color:var(--ink-soft); font-size:13.5px; align-self:center; }
.tx-submit{ height:38px; }
.tx-list{ display:flex; flex-direction:column; gap:8px; }
.tx-row{ display:grid; grid-template-columns:auto auto 1fr auto auto; align-items:center; gap:12px; padding:12px 16px; }
.tx-kind{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
.tx-kind.loan{ background:var(--red-bg); color:var(--red); }
.tx-kind.repay{ background:var(--green-bg); color:var(--green); }
.tx-amount{ font-family:'Cairo'; font-weight:800; font-variant-numeric:tabular-nums; font-size:15px; }
.tx-note{ color:var(--ink-soft); font-size:13.5px; }
.tx-date{ color:var(--muted); font-size:12.5px; white-space:nowrap; }
.tx-del{ width:28px; height:28px; border-radius:8px; color:var(--muted); font-size:12px; background:var(--bg); }
.tx-del:hover, .tx-del.armed{ background:var(--red); color:#fff; }
.tx-actions{ display:flex; align-items:center; gap:6px; }
.tx-edit-btn{ width:28px; height:28px; border-radius:8px; color:var(--muted); font-size:13px; background:var(--bg); }
.tx-edit-btn:hover{ background:var(--brass); color:#1a1205; }
.tx-row-edit{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; }
.tx-row-edit select, .tx-row-edit input{ border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; }
.tx-row-edit .money-input{ width:120px; }
.tx-note-input{ flex:1; min-width:120px; }
.tx-edit-actions{ display:flex; gap:6px; margin-inline-start:auto; }

/* ===== الأهداف ===== */
.goals{ display:flex; flex-direction:column; gap:18px; }
.daily-target{ padding:18px 22px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.dt-head{ flex:1; min-width:200px; }
.dt-title{ display:block; font-family:'Cairo'; font-weight:800; font-size:18px; }
.dt-sub{ display:block; color:var(--muted); font-size:12.5px; margin-top:3px; }
.dt-field{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.dt-field input{ width:140px; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-family:'Cairo'; font-weight:700; font-size:18px; font-variant-numeric:tabular-nums; }
.dt-field input:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(180,137,74,.14); }
.dt-derived{ display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink-soft); }
.final-goal{ padding:20px clamp(16px,3vw,24px); }
.fg-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.fg-eyebrow{ display:block; font-family:'Cairo'; font-weight:800; font-size:21px; color:var(--brass); }
.fg-sub{ display:block; color:var(--muted); font-size:13px; margin-top:3px; }
.fg-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:12px; margin:18px 0; }
.fg-field{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); }
.fg-field input{ border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; font-family:'Cairo'; font-weight:700; font-variant-numeric:tabular-nums; }
.fg-field input:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(180,137,74,.14); }
.fg-stat{ background:var(--bg); border-radius:12px; padding:11px 14px; display:flex; flex-direction:column; gap:5px; }
.fg-stat span{ font-size:12px; color:var(--muted); }
.fg-stat b{ font-family:'Cairo'; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; }
.fg-proj{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.proj-card{ border:1px solid var(--line); border-radius:13px; padding:13px 15px; display:flex; flex-direction:column; gap:7px; }
.proj-label{ font-family:'Cairo'; font-weight:700; font-size:14px; }
.proj-rate{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.proj-rate input{ width:120px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; font-variant-numeric:tabular-nums; }
.proj-rate input:focus{ outline:none; border-color:var(--brass); }
.proj-eta{ font-weight:700; font-size:13.5px; color:var(--brass); }
.proj-hint{ font-size:11.5px; color:var(--muted); }
.goals-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.goal-add{ display:flex; gap:8px; flex-wrap:wrap; }
.goal-add input{ border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; }
.goal-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; }
.goal-card{ padding:16px; }
.goal-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.goal-name{ flex:1; border:1px solid transparent; border-radius:9px; padding:7px 8px; font-family:'Cairo'; font-weight:700; font-size:16px; background:transparent; }
.goal-name:hover{ background:var(--bg); } .goal-name:focus{ outline:none; border-color:var(--line); }
.goal-del{ width:30px; height:30px; border-radius:8px; color:var(--muted); font-size:13px; background:var(--bg); }
.goal-del:hover, .goal-del.armed{ background:var(--red); color:#fff; }
.goal-body{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.goal-stats{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:8px; }
.gs-target{ display:flex; flex-direction:column; gap:3px; margin-bottom:4px; }
.gs-target span{ font-size:12px; color:var(--muted); }
.gs-target b{ font-family:'Cairo'; font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; }
.gs-line{ display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--muted); }
.gs-line b{ font-family:'Cairo'; font-weight:700; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums; }
.brass{ color:var(--brass) !important; }
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
.confetti-piece{ position:absolute; top:-18px; border-radius:2px; animation-name:confFall; animation-timing-function:cubic-bezier(.35,.2,.6,1); animation-fill-mode:forwards; }
@keyframes confFall{ 0%{ transform:translateY(-20px) rotateZ(0); opacity:1; } 100%{ transform:translateY(106vh) rotateZ(620deg); opacity:.95; } }
.ring-box{ position:relative; flex-shrink:0; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.ring-ach{ font-family:'Cairo'; font-weight:800; font-size:21px; line-height:1; font-variant-numeric:tabular-nums; }
.ring-cur{ font-size:10px; color:var(--muted); }
.ring-pct{ font-family:'Cairo'; font-weight:800; font-size:15px; margin-top:3px; }

/* خانة المبلغ بفاصلة الآلاف */
.money-input{ text-align:left; font-variant-numeric:tabular-nums; }

/* المبلغ اليومي (مدمج) */
.daily-target{ padding:16px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.dt-head{ min-width:170px; }
.dt-title{ display:block; font-family:'Cairo'; font-weight:800; font-size:16px; }
.dt-sub{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
.dt-field{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
.dt-input{ width:108px !important; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-family:'Cairo'; font-weight:700; font-size:16px; }
.dt-input:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(180,137,74,.14); }
.dt-derived{ display:flex; gap:8px; flex-wrap:wrap; flex:1; justify-content:flex-end; }
.dt-chip{ background:var(--bg); border-radius:11px; padding:7px 12px; display:flex; flex-direction:column; gap:2px; min-width:96px; }
.dt-chip span{ font-size:11px; color:var(--muted); }
.dt-chip b{ font-family:'Cairo'; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.dt-chip.wide{ min-width:150px; }

/* الهدف النهائي — دائرة في المنتصف متحركة */
.final-goal{ padding:22px clamp(16px,3vw,24px); }
.fg-eyebrow-row{ text-align:center; margin-bottom:6px; }
.fg-eyebrow{ display:block; font-family:'Cairo'; font-weight:800; font-size:21px; color:var(--brass); }
.fg-sub{ display:block; color:var(--muted); font-size:13px; margin-top:3px; }
.fg-ring-wrap{ display:flex; justify-content:center; padding:14px 0 18px; }
.final-ring{ position:relative; filter:drop-shadow(0 6px 18px rgba(180,137,74,.28)); animation:fgFloat 4s ease-in-out infinite; }
@keyframes fgFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
.fg-progress{ animation:fgFill 1.3s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fgFill{ from{ stroke-dashoffset:var(--circ); } to{ stroke-dashoffset:var(--off); } }
.final-ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.fr-pct{ font-family:'Cairo'; font-weight:800; font-size:30px; color:var(--brass); line-height:1; }
.fr-cur{ font-family:'Cairo'; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; }
.fr-of{ font-size:11.5px; color:var(--muted); }
.fg-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:12px; }
.fg-field{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); }
.fg-field input{ border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; font-family:'Cairo'; font-weight:700; }
.fg-field input:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px rgba(180,137,74,.14); }
.fg-stat{ background:var(--bg); border-radius:12px; padding:11px 14px; display:flex; flex-direction:column; gap:5px; }
.fg-stat span{ font-size:12px; color:var(--muted); }
.fg-stat b{ font-family:'Cairo'; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; }

/* النسخة الاحتياطية وأسماء الصفحات */
.page-key{ flex:1; min-width:120px; color:var(--muted); font-size:13px; }
.bk-label{ font-size:12.5px; color:var(--muted); margin-top:4px; }
.bk-area{ width:100%; min-height:90px; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; font-family:monospace; resize:vertical; direction:ltr; }
.bk-area:focus{ outline:none; border-color:var(--brass); }
.bk-msg{ font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--bg); padding:8px 12px; border-radius:9px; }

/* ===== الإعدادات (صفحة كاملة) ===== */
.settings-page{ display:flex; flex-direction:column; gap:14px; }
.settings-card{ overflow:hidden; }
.settings-head{ padding:18px 22px 14px; border-bottom:1px solid var(--line); }
.settings-title{ font-family:'Reem Kufi'; font-weight:700; font-size:22px; }
.settings-body{ padding:20px 22px 26px; }
.set-input{ border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; min-width:180px; }
.set-input:focus{ outline:none; border-color:var(--brass); }
.modal-backdrop{ position:fixed; inset:0; background:rgba(8,12,18,.55); backdrop-filter:blur(3px); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
.modal{ background:var(--surface); width:100%; max-width:680px; max-height:92vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column; animation:slideUp .22s ease; }
@keyframes slideUp{ from{ transform:translateY(24px); opacity:.6; } to{ transform:none; opacity:1; } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px; border-bottom:1px solid var(--line); }
.modal-head h2{ font-family:'Cairo'; font-weight:800; font-size:20px; }
.x{ width:36px; height:36px; border-radius:10px; background:var(--bg); color:var(--ink-soft); font-size:15px; }
.x:hover{ background:var(--hover); }
.seg{ display:flex; gap:4px; padding:12px 20px; overflow-x:auto; border-bottom:1px solid var(--line); }
.seg-btn{ padding:8px 14px; border-radius:9px; font-weight:600; font-size:13.5px; color:var(--muted); white-space:nowrap; }
.seg-btn.active{ background:var(--navy); color:#fff; }
.modal-body{ padding:18px 20px 26px; overflow-y:auto; }
.settings-block{ display:flex; flex-direction:column; gap:14px; }
.set-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--bg); border-radius:12px; padding:14px 16px; flex-wrap:wrap; }
.set-hint{ color:var(--muted); font-size:12.5px; margin-top:3px; }
.save-stamp{ color:var(--green); font-weight:700; font-size:13.5px; }
.add-card{ display:flex; gap:8px; flex-wrap:wrap; background:var(--bg); border-radius:12px; padding:12px; }
.add-card input{ flex:1; min-width:140px; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:14px; }
.list{ display:flex; flex-direction:column; gap:8px; }
.list-item{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.li-name{ flex:1; min-width:120px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:14px; }
.asset-group{ border:1px solid var(--line); border-radius:12px; padding:12px; }
.ag-head{ font-family:'Cairo'; font-weight:700; font-size:14.5px; margin-bottom:10px; color:var(--brass); }
.list-item.history{ background:var(--bg); border-radius:10px; padding:8px 12px; }
.hist-date{ flex:1; font-weight:600; font-size:14px; }
.hist-total{ font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:13.5px; }
.reset-zone{ margin-top:10px; padding-top:14px; border-top:1px solid var(--line); }

@media (max-width:720px){
  .topbar{ flex-wrap:wrap; }
  .tabs{ order:3; width:100%; margin:0; }
  .tab{ flex:1; }
  .hero{ grid-template-columns:1fr; }
  .day-summary{ flex-direction:column; align-items:flex-start; }
  .cmp-grid{ grid-template-columns:1fr; }
  .cmp-mid{ flex-direction:row; gap:8px; min-width:0; }
  .fg-grid{ grid-template-columns:1fr; }
  .fg-proj{ grid-template-columns:1fr; }
  .record-badge{ margin-inline-start:0; }
  .log-row-head{ display:none; }
  .log-row{ grid-template-columns:1fr 1fr; gap:8px 12px; }
  .lr-actions{ grid-column:1 / -1; justify-self:stretch; }
  .lr-actions .btn-ghost, .lr-actions button{ flex:1; }
  .log-row span[data-label]::before{ content:attr(data-label) "‏: "; color:var(--muted); font-size:11px; font-weight:600; display:block; margin-bottom:2px; }
  .tx-row{ grid-template-columns:auto 1fr auto; row-gap:6px; }
  .tx-note{ grid-column:1 / -1; }
}
`;

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<pre style="padding:16px;direction:ltr;white-space:pre-wrap;color:#C0392B;font-size:12px">' +
      String((e && e.stack) || e) + "</pre>";
  }
})();
</script>
</body>
</html>
